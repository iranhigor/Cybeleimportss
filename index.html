<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>CYBELE IMPORTS — Curadoria Internacional</title>
  <meta name="description" content="Descubra o mundo através dos importados. Produtos selecionados, novidades internacionais e uma experiência de compra especial para você." />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fontes Editoriais -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- React & ReactDOM (Produção) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone para executar JSX diretamente no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .font-editorial { font-family: 'Cormorant Garamond', Georgia, serif; }
    body, .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#FFFFFF] text-[#39291F] antialiased selection:bg-[#E5D5C0] selection:text-[#39291F]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Error Boundary para evitar tela branca em caso de erro de renderização
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      componentDidCatch(err) {
        console.error('Erro capturado na interface:', err);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#FFFFFF] text-[#39291F] flex items-center justify-center p-6 text-center">
              <div className="max-w-md bg-[#F3EBDD] border border-[#E5D5C0] rounded-[2rem] p-8">
                <h2 className="font-editorial text-3xl mb-2">CYBELE IMPORTS</h2>
                <p className="text-xs text-[#77716B] mb-6">
                  Houve uma oscilação na exibição da página. Recarregue para continuar.
                </p>
                <button
                  type="button"
                  onClick={() => window.location.reload()}
                  className="px-6 py-3 rounded-full bg-[#39291F] text-[#FFFFFF] text-xs uppercase tracking-widest"
                >
                  Recarregar Página
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ============================================================================
    // CONFIGURAÇÕES DA LOJA, UTILITÁRIOS E ÍCONES
    // ============================================================================
    const STORE_CONFIG = {
      name: 'CYBELE IMPORTS',
      subtitle: 'CURADORIA INTERNACIONAL',
      whatsappNumber: '+55 15 99786-0198',
      whatsappLink:
        'https://wa.me/5515997860198?text=Ol%C3%A1!%20Conheci%20a%20Cybele%20Imports%20pelo%20site%20e%20gostaria%20de%20saber%20mais%20sobre%20os%20produtos.',
      instagramHandle: '@cibele_fog_barros',
      instagramLink: 'https://www.instagram.com/cibele_fog_barros/',
      addressLabel: 'R. Maria José Rocha Thibes - Tupy, Itapetininga - SP, 18207-811',
      mapsLink: 'https://maps.app.goo.gl/8YBc4X5eShC9XByy7',
      hoursLabel: 'Seg a Sáb • Atendimento Personalizado & Retirada Agendada',
    };

    const CURATION_PILLARS = [
      {
        id: 'Perfumes Importados',
        tag: 'Fragrâncias',
        title: 'Perfumes & Perfumaria',
        desc: 'Essências marcantes, eau de parfum e lançamentos internacionais originais.',
        image: 'https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=800&q=80',
      },
      {
        id: 'Cosméticos e Skincare',
        tag: 'Cuidados & Beleza',
        title: 'Cosméticos & Skincare',
        desc: 'Rotina facial, maquiagens e tratamentos selecionados de marcas globais.',
        image: 'https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=800&q=80',
      },
      {
        id: 'Acessórios e Óculos',
        tag: 'Estilo & Luxo',
        title: 'Bolsas, Óculos & Acessórios',
        desc: 'Peças atemporais e detalhes sofisticados para elevar qualquer produção.',
        image: 'https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=800&q=80',
      },
      {
        id: 'Encomenda Sob Medida',
        tag: 'Exclusividade',
        title: 'Encomendas Sob Medida',
        desc: 'Não encontrou o que procurava? Envie o nome ou referência e cotamos para você.',
        image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80',
      },
    ];

    // Componente de ícones SVG leves e auto-contidos para a interface
    function Icon({ name, className = 'w-4 h-4' }) {
      switch (name) {
        case 'search':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" className={className} aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" strokeLinecap="round" />
            </svg>
          );
        case 'x':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" className={className} aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" strokeLinecap="round" />
            </svg>
          );
        case 'whatsapp':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" className={className} aria-hidden="true">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" strokeLinecap="round" strokeLinejoin="round" />
              <path d="M9.5 8.8c.2-.4.5-.4.8-.4h.6c.2 0 .5.1.6.4l.8 1.9c.1.2.1.5 0 .7l-.5.7c-.1.2-.2.4 0 .7.3.5.8 1.1 1.4 1.6.7.6 1.3 1 1.8 1.2.2.1.5.1.7-.1l.6-.7c.2-.2.4-.2.7-.1l1.8.8c.3.1.4.4.4.6v.6c0 .3-.1.6-.4.8-.4.3-1 .6-1.7.6-.8 0-1.9-.3-3.4-1.2-1.5-.9-2.8-2.2-3.7-3.7-.9-1.5-1.2-2.6-1.2-3.4 0-.7.3-1.3.6-1.7z" fill="currentColor" stroke="none" />
            </svg>
          );
        case 'sparkles':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" className={className} aria-hidden="true">
              <path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8L12 3z" strokeLinejoin="round" />
              <path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z" strokeLinejoin="round" />
            </svg>
          );
        case 'award':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" className={className} aria-hidden="true">
              <circle cx="12" cy="8.5" r="5.5" />
              <path d="M8.5 13.5 7 21l5-2.5L17 21l-1.5-7.5" strokeLinejoin="round" />
            </svg>
          );
        case 'shield':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" className={className} aria-hidden="true">
              <path d="M12 3 5 6v6c0 5 3 8.5 7 9.5 4-1 7-4.5 7-9.5V6l-7-3z" strokeLinejoin="round" />
              <path d="m9.5 12 1.7 1.7 3.3-3.4" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
          );
        case 'arrowRight':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" className={className} aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
          );
        case 'instagram':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" className={className} aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
            </svg>
          );
        case 'phone':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" className={className} aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.58 2.81.7A2 2 0 0 1 22 16.92z" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
          );
        case 'mapPin':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" className={className} aria-hidden="true">
              <path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z" strokeLinejoin="round" />
              <circle cx="12" cy="9.5" r="2.5" />
            </svg>
          );
        case 'lock':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" className={className} aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" strokeLinecap="round" />
            </svg>
          );
        default:
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" className={className} aria-hidden="true">
              <circle cx="12" cy="12" r="8" />
            </svg>
          );
      }
    }

    // ============================================================================
    // APLICAÇÃO PRINCIPAL — CYBELE IMPORTS (VITRINE & ATENDIMENTO WHATSAPP)
    // ============================================================================
    function App() {
      const [selectedTopic, setSelectedTopic] = useState('Todos');
      const [searchQuery, setSearchQuery] = useState('');
      const [customRequestName, setCustomRequestName] = useState('');
      const [copiedAddress, setCopiedAddress] = useState(false);
      const catalogSectionRef = useRef(null);

      const scrollToCatalog = (topic = 'Todos') => {
        setSelectedTopic(topic);
        setTimeout(() => {
          catalogSectionRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, 60);
      };

      useEffect(() => {
        try {
          localStorage.removeItem('cybele_user_session_v2');
          sessionStorage.removeItem('cybele_owner_session');
          sessionStorage.removeItem('cybele_user_profile');
        } catch {}
      }, []);

      const buildWhatsappCategoryLink = (topic) => {
        const msg =
          topic && topic !== 'Todos'
            ? `Olá! Conheci a Cybele Imports pelo site e gostaria de consultar disponibilidade e valores de ${topic}.`
            : 'Olá! Conheci a Cybele Imports pelo site e gostaria de saber mais sobre os produtos.';
        return `https://wa.me/5515997860198?text=${encodeURIComponent(msg)}`;
      };

      const buildCustomQuoteWhatsappLink = () => {
        const itemText = customRequestName.trim() || searchQuery.trim();
        const msg = itemText
          ? `Olá! Vim pelo site da Cybele Imports e gostaria de consultar disponibilidade e orçamento para: ${itemText}.`
          : 'Olá! Vim pelo site da Cybele Imports e gostaria de fazer uma consulta de produto importado.';
        return `https://wa.me/5515997860198?text=${encodeURIComponent(msg)}`;
      };

      const handleCopyAddress = () => {
        try {
          if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(STORE_CONFIG.addressLabel);
          } else {
            const temp = document.createElement('textarea');
            temp.value = STORE_CONFIG.addressLabel;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
          }
          setCopiedAddress(true);
          setTimeout(() => setCopiedAddress(false), 2500);
        } catch {}
      };

      return (
        <div className="min-h-screen bg-[#FFFFFF] text-[#39291F] font-sans antialiased">
          {/* Barra Superior */}
          <div className="bg-[#39291F] text-[#F3EBDD] text-[11px] tracking-[0.18em] uppercase py-2.5 px-4 text-center">
            <span>Curadoria Internacional • Paraguai, Argentina &amp; Destinos Exclusivos</span>
          </div>

          {/* Cabeçalho */}
          <header className="sticky top-0 z-40 bg-[#FFFFFF]/95 backdrop-blur-md border-b border-[#E5D5C0]/50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
              <nav className="hidden lg:flex items-center gap-7 text-xs tracking-[0.15em] uppercase text-[#70513D]">
                <button onClick={() => { setSelectedTopic('Todos'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="hover:text-[#39291F] font-medium">Início</button>
                <button onClick={() => scrollToCatalog('Todos')} className="hover:text-[#39291F] font-medium">Atendimento</button>
                <button onClick={() => scrollToCatalog('Perfumes')} className="hover:text-[#39291F]">Perfumes</button>
                <button onClick={() => scrollToCatalog('Ofertas')} className="hover:text-[#39291F]">Ofertas</button>
              </nav>

              <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="flex flex-col items-center justify-center text-center">
                <span className="font-editorial text-2xl sm:text-3xl tracking-[0.22em] font-semibold text-[#39291F] leading-none">CYBELE IMPORTS</span>
                <span className="text-[9px] tracking-[0.35em] text-[#77716B] uppercase mt-1">{STORE_CONFIG.subtitle}</span>
              </button>

              <div className="flex items-center gap-2 sm:gap-3">
                <div className="hidden md:flex items-center bg-[#F3EBDD]/70 border border-[#E5D5C0] rounded-full px-3.5 py-1.5 w-48 lg:w-56 focus-within:bg-[#FFFFFF] focus-within:border-[#70513D]">
                  <Icon name="search" className="w-3.5 h-3.5 text-[#77716B] mr-2 shrink-0" />
                  <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="O que você procura?" className="bg-transparent text-xs text-[#39291F] placeholder-[#77716B] focus:outline-none w-full" />
                  {searchQuery && <button onClick={() => setSearchQuery('')} className="text-[#77716B] hover:text-[#39291F]"><Icon name="x" className="w-3.5 h-3.5" /></button>}
                </div>

                <a
                  href={STORE_CONFIG.whatsappLink}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="px-4 py-2.5 rounded-full bg-[#39291F] text-[#FFFFFF] hover:bg-[#70513D] transition-all flex items-center gap-2 text-[10px] tracking-widest uppercase font-medium"
                >
                  <Icon name="whatsapp" className="w-4 h-4 text-[#E5D5C0]" />
                  <span>WhatsApp</span>
                </a>
              </div>
            </div>

            <div className="md:hidden px-4 pb-3">
              <div className="flex items-center bg-[#F3EBDD]/70 border border-[#E5D5C0] rounded-full px-4 py-2">
                <Icon name="search" className="w-4 h-4 text-[#77716B] mr-2" />
                <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="O que você procura no WhatsApp?" className="bg-transparent text-xs text-[#39291F] placeholder-[#77716B] focus:outline-none w-full" />
              </div>
            </div>
          </header>

          {/* =================================================================== */}
          {/* VITRINE PRINCIPAL & ATENDIMENTO WHATSAPP                            */}
          {/* =================================================================== */}
          <main>
            <section className="px-4 sm:px-6 lg:px-8 pt-6 pb-8">
              <div className="max-w-7xl mx-auto relative overflow-hidden rounded-[2.5rem] bg-[#39291F] text-[#FFFFFF] px-6 py-16 sm:px-14 sm:py-24 lg:py-28 shadow-xl">
                <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=1800&q=85" alt="Perfume de Luxo Cybele Imports" className="absolute inset-0 w-full h-full object-cover object-center opacity-55" />
                <div className="absolute inset-0 bg-gradient-to-r from-[#39291F]/95 via-[#39291F]/75 to-[#39291F]/30 pointer-events-none" />
                <div className="relative z-10 max-w-2xl">
                  <span className="inline-block px-4 py-1.5 rounded-full bg-[#FFFFFF]/15 border border-[#E5D5C0]/30 text-[#E5D5C0] text-[10px] tracking-[0.25em] uppercase mb-6">Curadoria Exclusiva • Cybele Imports</span>
                  <h1 className="font-editorial text-4xl sm:text-5xl lg:text-6xl font-medium leading-[1.12] text-[#FFFFFF] mb-6">Descubra o mundo através dos importados.</h1>
                  <p className="text-sm sm:text-base text-[#F3EBDD]/95 font-light leading-relaxed mb-9 max-w-xl">Produtos selecionados, novidades internacionais e atendimento personalizado direto pelo nosso WhatsApp.</p>
                  <div className="flex flex-wrap items-center gap-4">
                    <a href={STORE_CONFIG.whatsappLink} target="_blank" rel="noopener noreferrer" className="px-8 py-4 rounded-full bg-[#FFFFFF] text-[#39291F] text-xs font-semibold tracking-[0.2em] uppercase hover:bg-[#F3EBDD] shadow-md inline-flex items-center gap-2.5">
                      <Icon name="whatsapp" className="w-4 h-4 text-[#39291F]" />
                      ATENDIMENTO NO WHATSAPP
                    </a>
                    <button onClick={() => scrollToCatalog('Todos')} className="px-7 py-4 rounded-full bg-[#39291F]/50 border border-[#E5D5C0]/45 text-[#F3EBDD] text-xs tracking-[0.16em] uppercase hover:bg-[#FFFFFF]/15">Consultar Agora</button>
                  </div>
                </div>
              </div>
            </section>

            {/* Diferenciais */}
            <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                {[
                  { icon: 'sparkles', title: 'Curadoria Internacional', desc: 'Seleção criteriosa de importados' },
                  { icon: 'award', title: 'Origem Garantida', desc: 'Paraguai, Argentina & destinos globais' },
                  { icon: 'whatsapp', title: 'Atendimento Personalizado', desc: 'Consultoria direta via WhatsApp' },
                  { icon: 'shield', title: 'Encomendas Sob Medida', desc: 'Buscamos o item que você deseja' },
                ].map((item, idx) => (
                  <div key={idx} className="bg-[#F3EBDD]/55 border border-[#E5D5C0]/70 rounded-3xl p-4 sm:p-5 flex items-center gap-3.5">
                    <div className="w-10 h-10 rounded-full bg-[#FFFFFF] border border-[#E5D5C0] flex items-center justify-center shrink-0 text-[#70513D]"><Icon name={item.icon} className="w-4 h-4" /></div>
                    <div>
                      <h3 className="text-xs font-semibold text-[#39291F]">{item.title}</h3>
                      <p className="text-[11px] text-[#77716B] mt-0.5">{item.desc}</p>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* Cards Editoriais */}
            <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-12">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                <a href={buildWhatsappCategoryLink('Novidades Internacionais')} target="_blank" rel="noopener noreferrer" className="relative overflow-hidden text-left rounded-[2rem] bg-[#F3EBDD] border border-[#E5D5C0] p-7 hover:shadow-lg group flex flex-col justify-between min-h-[220px]">
                  <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=800&q=80" alt="Novidades" className="absolute inset-0 w-full h-full object-cover opacity-35 group-hover:scale-105 transition-transform duration-500" />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#F3EBDD]/95 via-[#F3EBDD]/80 to-[#F3EBDD]/40" />
                  <div className="relative z-10">
                    <span className="text-[10px] uppercase tracking-[0.22em] text-[#70513D] font-semibold">Lançamentos</span>
                    <h3 className="font-editorial text-3xl text-[#39291F] mt-1">Novidades Internacionais</h3>
                    <p className="text-xs text-[#39291F]/80 mt-2 max-w-[240px]">Consulte os recém-chegados das melhores vitrines internacionais pelo WhatsApp.</p>
                  </div>
                  <span className="relative z-10 inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-[#39291F] mt-5">Consultar no WhatsApp <Icon name="arrowRight" className="w-3.5 h-3.5" /></span>
                </a>

                <a href={buildWhatsappCategoryLink('Itens Mais Procurados')} target="_blank" rel="noopener noreferrer" className="relative overflow-hidden text-left rounded-[2rem] bg-[#39291F] text-[#FFFFFF] p-7 hover:shadow-lg group flex flex-col justify-between min-h-[220px]">
                  <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80" alt="Mais Procurados" className="absolute inset-0 w-full h-full object-cover opacity-45 group-hover:scale-105 transition-transform duration-500" />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#39291F]/95 via-[#39291F]/75 to-[#39291F]/35" />
                  <div className="relative z-10">
                    <span className="text-[10px] uppercase tracking-[0.22em] text-[#E5D5C0] font-semibold">Favoritos</span>
                    <h3 className="font-editorial text-3xl text-[#FFFFFF] mt-1">Mais Procurados</h3>
                    <p className="text-xs text-[#F3EBDD]/85 mt-2 max-w-[240px]">Perfumes, cosméticos e acessórios mais desejados pelas nossas clientes.</p>
                  </div>
                  <span className="relative z-10 inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-[#E5D5C0] mt-5">Falar com Consultora <Icon name="arrowRight" className="w-3.5 h-3.5" /></span>
                </a>

                <a href={buildWhatsappCategoryLink('Encomendas Personalizadas')} target="_blank" rel="noopener noreferrer" className="relative overflow-hidden text-left rounded-[2rem] bg-[#E5D5C0] border border-[#E5D5C0] p-7 hover:shadow-lg group flex flex-col justify-between min-h-[220px]">
                  <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?auto=format&fit=crop&w=800&q=80" alt="Encomendas" className="absolute inset-0 w-full h-full object-cover opacity-35 group-hover:scale-105 transition-transform duration-500" />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#E5D5C0]/95 via-[#E5D5C0]/80 to-[#E5D5C0]/40" />
                  <div className="relative z-10">
                    <span className="text-[10px] uppercase tracking-[0.22em] text-[#70513D] font-semibold">Sob Encomenda</span>
                    <h3 className="font-editorial text-3xl text-[#39291F] mt-1">Pedidos Exclusivos</h3>
                    <p className="text-xs text-[#39291F]/80 mt-2 max-w-[240px]">Envie o nome ou foto do produto desejado e fazemos a cotação para você.</p>
                  </div>
                  <span className="relative z-10 inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-[#39291F] mt-5">Solicitar Cotação <Icon name="arrowRight" className="w-3.5 h-3.5" /></span>
                </a>
              </div>
            </section>

            {/* Central de Atendimento WhatsApp */}
            <section ref={catalogSectionRef} className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 scroll-mt-24">
              <div className="bg-[#F3EBDD]/45 border border-[#E5D5C0] rounded-[2.5rem] p-10 sm:p-16 text-center max-w-3xl mx-auto">
                <div className="w-16 h-16 rounded-full bg-[#FFFFFF] border border-[#E5D5C0] flex items-center justify-center mx-auto mb-5 text-[#70513D]"><Icon name="whatsapp" className="w-7 h-7" /></div>
                <span className="text-[10px] uppercase tracking-[0.25em] text-[#77716B]">Atendimento Direto</span>
                <h2 className="font-editorial text-3xl sm:text-4xl text-[#39291F] mt-1 mb-3">
                  {searchQuery.trim()
                    ? `Consultar "${searchQuery.trim()}"`
                    : selectedTopic === 'Todos'
                    ? 'Atendimento Exclusivo via WhatsApp'
                    : `Atendimento • ${selectedTopic}`}
                </h2>
                <p className="text-xs sm:text-sm text-[#77716B] leading-relaxed max-w-lg mx-auto mb-8">
                  Para garantir disponibilidade imediata, fotos reais, valores atualizados e condições especiais de entrega, nosso atendimento é realizado diretamente pelo WhatsApp oficial da <strong>CYBELE IMPORTS</strong>.
                </p>

                {/* Solicitação Rápida de Produto / Cotação */}
                <div className="max-w-md mx-auto mb-7 text-left">
                  <label className="block text-[10px] uppercase tracking-[0.2em] text-[#70513D] font-semibold mb-2">
                    Qual produto ou importado você procura?
                  </label>
                  <input
                    type="text"
                    value={customRequestName}
                    onChange={(e) => setCustomRequestName(e.target.value)}
                    placeholder="Ex: Perfume importado, creme facial, óculos..."
                    className="w-full px-4 py-3 rounded-full bg-[#FFFFFF] border border-[#E5D5C0] text-xs text-[#39291F] placeholder-[#77716B] focus:outline-none focus:border-[#70513D]"
                  />
                </div>

                <div className="flex flex-wrap items-center justify-center gap-3">
                  <a
                    href={
                      customRequestName.trim()
                        ? buildCustomQuoteWhatsappLink()
                        : buildWhatsappCategoryLink(searchQuery.trim() || selectedTopic)
                    }
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-8 py-4 rounded-full bg-[#39291F] text-[#FFFFFF] text-xs uppercase tracking-widest font-medium hover:bg-[#70513D] inline-flex items-center gap-2.5 shadow-md"
                  >
                    <Icon name="whatsapp" className="w-4 h-4 text-[#E5D5C0]" />
                    Chamar no WhatsApp ({STORE_CONFIG.whatsappNumber})
                  </a>
                  {(selectedTopic !== 'Todos' || searchQuery || customRequestName) && (
                    <button
                      onClick={() => { setSelectedTopic('Todos'); setSearchQuery(''); setCustomRequestName(''); }}
                      className="px-6 py-4 rounded-full bg-[#FFFFFF] border border-[#E5D5C0] text-[#39291F] text-xs uppercase tracking-widest"
                    >
                      Limpar Consulta
                    </button>
                  )}
                </div>
              </div>
            </section>

            {/* Vitrine Editorial de Categorias & Encomendas */}
            <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
              <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-3 mb-6">
                <div>
                  <span className="text-[10px] uppercase tracking-[0.25em] text-[#77716B]">Especialidades</span>
                  <h2 className="font-editorial text-3xl sm:text-4xl text-[#39291F]">O que você encontra na Cybele Imports</h2>
                </div>
                <p className="text-xs text-[#77716B]">{STORE_CONFIG.hoursLabel}</p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                {CURATION_PILLARS.map((pillar) => (
                  <a
                    key={pillar.id}
                    href={buildWhatsappCategoryLink(pillar.title)}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="group bg-[#FFFFFF] border border-[#E5D5C0] rounded-[2rem] overflow-hidden hover:shadow-xl transition-all flex flex-col justify-between"
                  >
                    <div className="aspect-[4/3] bg-[#F3EBDD] overflow-hidden relative">
                      <img
                        src={pillar.image}
                        alt={pillar.title}
                        className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                      />
                    </div>
                    <div className="p-5 flex-1 flex flex-col justify-between">
                      <div>
                        <span className="text-[10px] uppercase tracking-[0.22em] text-[#70513D] font-semibold">
                          {pillar.tag}
                        </span>
                        <h3 className="font-editorial text-2xl text-[#39291F] mt-1">
                          {pillar.title}
                        </h3>
                        <p className="text-xs text-[#77716B] mt-2 leading-relaxed">
                          {pillar.desc}
                        </p>
                      </div>
                      <span className="inline-flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wider text-[#39291F] mt-4 group-hover:translate-x-1 transition-transform">
                        Consultar Agora <Icon name="arrowRight" className="w-3.5 h-3.5" />
                      </span>
                    </div>
                  </a>
                ))}
              </div>
            </section>

            {/* Institucional */}
            <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
              <div className="bg-[#F3EBDD]/70 border border-[#E5D5C0] rounded-[2.5rem] p-8 sm:p-14 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                <div className="lg:col-span-7">
                  <span className="text-[10px] uppercase tracking-[0.25em] text-[#70513D]">Sobre a Marca</span>
                  <h2 className="font-editorial text-3xl sm:text-4xl text-[#39291F] mt-2 mb-4">Sofisticação e procedência em cada escolha.</h2>
                  <p className="text-xs sm:text-sm text-[#77716B] leading-relaxed mb-6">
                    A <strong>CYBELE IMPORTS</strong> nasceu com o propósito de aproximar você das melhores tendências internacionais do Paraguai, Argentina e mercados globais. Trabalhamos com curadoria dedicada, atendimento próximo e total transparência do atendimento à entrega.
                  </p>
                  <div className="flex flex-wrap items-center gap-4">
                    <a href={STORE_CONFIG.whatsappLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-[#39291F] text-[#FFFFFF] text-xs uppercase tracking-widest hover:bg-[#70513D]"><Icon name="whatsapp" className="w-4 h-4 text-[#E5D5C0]" /> {STORE_CONFIG.whatsappNumber}</a>
                    <a href={STORE_CONFIG.instagramLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-[#FFFFFF] border border-[#E5D5C0] text-[#39291F] text-xs uppercase tracking-widest"><Icon name="instagram" className="w-4 h-4 text-[#70513D]" /> Seguir {STORE_CONFIG.instagramHandle}</a>
                  </div>
                </div>
                <div className="lg:col-span-5 relative overflow-hidden bg-[#39291F] text-[#F3EBDD] rounded-[2rem] p-8 min-h-[240px] flex flex-col justify-end">
                  <img src="https://images.unsplash.com/photo-1595425970377-c9703cf48b6d?auto=format&fit=crop&w=900&q=80" alt="Curadoria Cybele Imports" className="absolute inset-0 w-full h-full object-cover opacity-40" />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#39291F]/95 via-[#39291F]/70 to-transparent" />
                  <div className="relative z-10">
                    <p className="font-editorial text-2xl text-[#FFFFFF] mb-2">Atendimento Personalizado</p>
                    <p className="text-xs text-[#E5D5C0]/90 leading-relaxed mb-5">Procura uma fragrância específica, cosmético importado ou acessório exclusivo? Fale diretamente com nossa equipe.</p>
                    <div className="space-y-2 text-xs text-[#F3EBDD]">
                      <div className="flex items-center gap-2.5"><Icon name="phone" className="w-4 h-4 text-[#E5D5C0]" /><span>{STORE_CONFIG.whatsappNumber}</span></div>
                      <div className="flex items-center gap-2.5"><Icon name="instagram" className="w-4 h-4 text-[#E5D5C0]" /><span>{STORE_CONFIG.instagramHandle}</span></div>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </main>

          {/* Rodapé */}
          <footer className="bg-[#39291F] text-[#F3EBDD] mt-12">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14 grid grid-cols-1 md:grid-cols-3 gap-10">
              <div className="md:col-span-2">
                <span className="font-editorial text-2xl tracking-[0.22em] text-[#FFFFFF]">CYBELE IMPORTS</span>
                <p className="text-xs text-[#E5D5C0]/80 mt-3 max-w-md leading-relaxed">Produtos selecionados, novidades internacionais e atendimento exclusivo via WhatsApp.</p>
                <a
                  href={STORE_CONFIG.mapsLink}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="mt-5 block max-w-lg rounded-3xl bg-[#FFFFFF]/10 hover:bg-[#FFFFFF]/15 border border-[#E5D5C0]/30 p-4 transition-all group"
                >
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex items-start gap-3">
                      <div className="w-9 h-9 rounded-full bg-[#E5D5C0] text-[#39291F] flex items-center justify-center shrink-0 mt-0.5">
                        <Icon name="mapPin" className="w-4 h-4" />
                      </div>
                      <div>
                        <span className="block text-[10px] uppercase tracking-[0.22em] text-[#E5D5C0] font-semibold">
                          Nosso Endereço
                        </span>
                        <span className="block text-xs sm:text-sm font-medium text-[#FFFFFF] mt-0.5">
                          {STORE_CONFIG.addressLabel}
                        </span>
                      </div>
                    </div>
                    <span className="inline-flex items-center gap-1 text-[11px] uppercase tracking-wider font-semibold text-[#E5D5C0] group-hover:translate-x-0.5 transition-transform shrink-0">
                      Ir no Maps <Icon name="arrowRight" className="w-3.5 h-3.5" />
                    </span>
                  </div>
                </a>
                <div className="mt-3 flex flex-wrap items-center gap-2">
                  <a
                    href={STORE_CONFIG.mapsLink}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#E5D5C0] text-[#39291F] text-[11px] font-semibold uppercase tracking-wider hover:bg-[#FFFFFF] transition-colors"
                  >
                    <Icon name="mapPin" className="w-3.5 h-3.5" />
                    Abrir Rota no Google Maps
                  </a>
                  <button
                    type="button"
                    onClick={handleCopyAddress}
                    className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#FFFFFF]/10 border border-[#E5D5C0]/30 text-[#F3EBDD] text-[11px] uppercase tracking-wider hover:bg-[#FFFFFF]/20 transition-colors"
                  >
                    {copiedAddress ? 'Endereço Copiado!' : 'Copiar Endereço'}
                  </button>
                </div>
              </div>
              <div>
                <h4 className="text-[11px] uppercase tracking-[0.2em] text-[#E5D5C0] font-semibold mb-4">Contato &amp; Redes</h4>
                <ul className="space-y-3 text-xs text-[#F3EBDD]/85">
                  <li><a href={STORE_CONFIG.whatsappLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 hover:text-[#FFFFFF]"><Icon name="phone" className="w-3.5 h-3.5 text-[#E5D5C0]" /> WhatsApp: {STORE_CONFIG.whatsappNumber}</a></li>
                  <li><a href={STORE_CONFIG.instagramLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 hover:text-[#FFFFFF]"><Icon name="instagram" className="w-3.5 h-3.5 text-[#E5D5C0]" /> Instagram: {STORE_CONFIG.instagramHandle}</a></li>
                  <li><a href={STORE_CONFIG.mapsLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-start gap-2 hover:text-[#FFFFFF]"><Icon name="mapPin" className="w-3.5 h-3.5 text-[#E5D5C0] shrink-0 mt-0.5" /><span>{STORE_CONFIG.addressLabel}</span></a></li>
                  <li className="flex items-center gap-2 text-[#E5D5C0]/75"><Icon name="lock" className="w-3.5 h-3.5" /> Atendimento Oficial</li>
                </ul>
              </div>
            </div>
            <div className="border-t border-[#E5D5C0]/15 py-5 px-4 text-center text-[11px] text-[#E5D5C0]/60">
              <span>© {new Date().getFullYear()} CYBELE IMPORTS. Todos os direitos reservados.</span>
            </div>
          </footer>

          {/* Botão Flutuante WhatsApp */}
          <a href={STORE_CONFIG.whatsappLink} target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 z-40 flex items-center gap-2.5 px-5 py-3.5 rounded-full bg-[#39291F] text-[#FFFFFF] border border-[#E5D5C0]/40 shadow-2xl hover:bg-[#70513D]">
            <Icon name="whatsapp" className="w-5 h-5 text-[#E5D5C0]" />
            <span className="text-xs font-medium tracking-wider">Falar no WhatsApp</span>
          </a>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
    }
  </script>
</body>
</html>
