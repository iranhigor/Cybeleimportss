    // ============================================================================
    // GERADOR OFICIAL DE PAYLOAD PIX (PADRÃO EMV / BANCO CENTRAL)
    // ============================================================================
    function computePixCRC16(payload) {
      let crc = 0xffff;
      for (let i = 0; i < payload.length; i++) {
        crc ^= payload.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          crc = (crc & 0x8000) !== 0 ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;
        }
      }
      return crc.toString(16).toUpperCase().padStart(4, '0');
    }

    function buildPixEmvPayload({ pixKey, merchantName, merchantCity, amount, txid }) {
      const formatField = (id, value) => `${id}${String(value).length.toString().padStart(2, '0')}${value}`;
      const cleanKey = String(pixKey || '36397679000141').replace(/\D/g, '');
      const cleanName = String(merchantName || 'CYBELE IMPORTS')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 25) || 'CYBELE IMPORTS';
      const cleanCity = String(merchantCity || 'SOROCABA')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 15) || 'BRASIL';
      const cleanTxid = String(txid || 'CYBELEIMPORTS').replace(/[^A-Za-z0-9]/g, '').slice(0, 25) || '***';

      const merchantAccountInfo = formatField('26', `${formatField('00', 'br.gov.bcb.pix')}${formatField('01', cleanKey)}`);
      const formattedAmount = Number(amount || 0).toFixed(2);
      const additionalData = formatField('62', formatField('05', cleanTxid));

      const partialPayload =
        formatField('00', '01') +
        merchantAccountInfo +
        formatField('52', '0000') +
        formatField('53', '986') +
        (Number(amount) > 0 ? formatField('54', formattedAmount) : '') +
        formatField('58', 'BR') +
        formatField('59', cleanName) +
        formatField('60', cleanCity) +
        additionalData +
        '6304';

      return `${partialPayload}${computePixCRC16(partialPayload)}`;
    }

    const compressImageFile = (file) =>
      new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDimension = 900;
            let width = img.width;
            let height = img.height;
            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.84));
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

        const ownerProfile = {
          uid: `owner_${cleanAdminEmail.replace(/[^a-z0-9]/g, '_')}`,
          name: 'Proprietária Cybele Imports',
          email: cleanAdminEmail,
          role: 'owner',
        };
        setCustomerProfile(ownerProfile);
        try {
          sessionStorage.setItem('cybele_owner_session', 'active');
          sessionStorage.setItem('cybele_user_profile', JSON.stringify(ownerProfile));
        } catch {}
        setIsAccountModalOpen(false);
        setActiveView('admin');
        setAdminTab('products');
        setAuthForm({ name: '', email: '', password: '', confirmPassword: '' });
        showToast('Acesso administrativo autenticado com sucesso.');
      };

      const handleLogout = () => {
        setIsAdminAuthenticated(false);
        setCustomerProfile(null);
        try {
          sessionStorage.removeItem('cybele_owner_session');
          sessionStorage.removeItem('cybele_user_profile');
        } catch {}
        setActiveView('store');
        showToast('Sessão encerrada com segurança.');
      };

      const handleImageUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const compressed = await compressImageFile(file);
          setProductForm((prev) => ({ ...prev, image: compressed }));
          showToast('Fotografia carregada e otimizada.');
        } catch {
          showToast('Não foi possível processar a imagem.', 'error');
        }
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!isAdminAuthenticated) return;
        const cleanName = sanitizeText(productForm.name);
        const numericPrice = parseFloat(String(productForm.price).replace(',', '.'));
        const numericPromo = productForm.promoPrice ? parseFloat(String(productForm.promoPrice).replace(',', '.')) : null;
        const numericStock = Math.max(0, parseInt(productForm.stock, 10) || 0);

        if (!cleanName || isNaN(numericPrice) || numericPrice <= 0) {
          showToast('Preencha o nome e um preço válido.', 'error');
          return;
        }

        const productId = editingProductId || `prod_${Date.now()}`;
        const payload = {
          id: productId,
          name: cleanName,
          description: sanitizeText(productForm.description),
          price: numericPrice,
          promoPrice: numericPromo && numericPromo > 0 ? numericPromo : null,
          stock: numericStock,
          category: productForm.category,
          image: sanitizeText(productForm.image),
          isFeatured: Boolean(productForm.isFeatured),
          isNew: Boolean(productForm.isNew),
          isBestSeller: Boolean(productForm.isBestSeller),
          createdAt: editingProductId ? products.find((p) => p.id === editingProductId)?.createdAt || Date.now() : Date.now(),
        };

        setProducts((prev) => (prev.some((p) => p.id === productId) ? prev.map((p) => (p.id === productId ? payload : p)) : [payload, ...prev]));
        setEditingProductId(null);
        setProductForm({ name: '', description: '', price: '', promoPrice: '', stock: '1', category: 'Perfumes', image: '', isFeatured: true, isNew: true, isBestSeller: false });
        showToast(editingProductId ? 'Produto atualizado na vitrine!' : 'Produto publicado na loja!');
      };

      const handleEditProduct = (product) => {
        setEditingProductId(product.id);
        setProductForm({
          name: product.name || '',
          description: product.description || '',
          price: String(product.price || ''),
          promoPrice: product.promoPrice ? String(product.promoPrice) : '',
          stock: String(product.stock ?? 0),
          category: product.category || 'Perfumes',
          image: product.image || '',
          isFeatured: Boolean(product.isFeatured),
          isNew: Boolean(product.isNew),
          isBestSeller: Boolean(product.isBestSeller),
        });
        setAdminTab('products');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleDeleteProduct = (productId) => {
        if (!isAdminAuthenticated) return;
        setProducts((prev) => prev.filter((p) => p.id !== productId));
        setCart((prev) => prev.filter((item) => item.id !== productId));
        showToast('Produto removido do catálogo.');
      };

      const filteredProducts = useMemo(() => {
        return products.filter((product) => {
          if (selectedCategory === 'Ofertas') {
            if (!product.promoPrice || product.promoPrice >= product.price) return false;
          } else if (selectedCategory !== 'Todos' && product.category !== selectedCategory) return false;

          if (editorialFilter === 'featured' && !product.isFeatured) return false;
          if (editorialFilter === 'new' && !product.isNew) return false;
          if (editorialFilter === 'bestseller' && !product.isBestSeller) return false;
          if (editorialFilter === 'promo' && (!product.promoPrice || product.promoPrice >= product.price)) return false;

          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            if (!product.name?.toLowerCase().includes(q) && !product.description?.toLowerCase().includes(q) && !product.category?.toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [products, selectedCategory, editorialFilter, searchQuery]);

      const addToCart = (product, qty = 1) => {
        if (!product || product.stock <= 0) {
          showToast('Este item está temporariamente esgotado.', 'error');
          return;
        }
        const effectivePrice = product.promoPrice && product.promoPrice < product.price ? product.promoPrice : product.price;
        setCart((prev) => {
          const existing = prev.find((item) => item.id === product.id);
          if (existing) {
            return prev.map((item) =>
              item.id === product.id ? { ...item, quantity: Math.min(product.stock, existing.quantity + qty), price: effectivePrice, stock: product.stock } : item
            );
          }
          return [...prev, { id: product.id, name: product.name, price: effectivePrice, image: product.image, category: product.category, stock: product.stock, quantity: Math.min(product.stock, qty) }];
        });
        showToast(`${product.name} adicionado à sacola.`);
        setIsCartOpen(true);
      };

      const updateCartQuantity = (productId, delta) => {
        setCart((prev) =>
          prev.map((item) => {
            if (item.id !== productId) return item;
            const prod = products.find((p) => p.id === productId);
            const maxStock = prod ? prod.stock : item.stock;
            const nextQty = item.quantity + delta;
            return nextQty <= 0 ? null : { ...item, quantity: Math.min(maxStock, nextQty) };
          }).filter(Boolean)
        );
      };

      const removeFromCart = (productId) => setCart((prev) => prev.filter((item) => item.id !== productId));

      const handleApplyCoupon = () => {
        const code = sanitizeText(couponInput).toUpperCase();
        const found = coupons.find((c) => c.active && c.code.toUpperCase() === code);
        if (found) {
          setAppliedCoupon(found);
          showToast(`Cupom ${found.code} aplicado (${found.discountPercent}% OFF)!`);
        } else {
          showToast('Cupom inválido ou expirado.', 'error');
        }
      };

      const cartItemsCount = useMemo(() => cart.reduce((acc, i) => acc + i.quantity, 0), [cart]);
      const subtotal = useMemo(() => cart.reduce((acc, i) => acc + i.price * i.quantity, 0), [cart]);
      const discountAmount = useMemo(() => (appliedCoupon ? (subtotal * appliedCoupon.discountPercent) / 100 : 0), [subtotal, appliedCoupon]);
      const shippingCost = useMemo(() => {
        if (cart.length === 0 || deliveryMethod === 'pickup') return 0;
        if (subtotal - discountAmount >= shippingConfig.freeShippingMin) return 0;
        return Number(shippingConfig.flatRate) || 0;
      }, [cart.length, deliveryMethod, subtotal, discountAmount, shippingConfig]);
      const grandTotal = Math.max(0, subtotal - discountAmount + shippingCost);

      // =========================================================================
      // MOTOR DE ETIQUETAS E NOTIFICAÇÕES INDIVIDUAIS POR E-MAIL
      // =========================================================================
      const dispatchOrderEmailNotifications = async ({ order, eventType, statusLabel }) => {
        const formattedDateTime = new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'medium' });
        const formattedAddress =
          order.deliveryMethod === 'pickup'
            ? 'Retirada Combinada via WhatsApp'
            : `${order.customer.address}, Nº ${order.customer.number}${order.customer.complement ? ` (${order.customer.complement})` : ''} — CEP ${order.customer.cep}`;
        const paymentLabel = order.paymentMethod === 'pix' ? 'PIX Instantâneo' : 'Cartão de Crédito';
        const itemsSummaryText = order.items.map((item) => `• ${item.quantity}x ${item.name} — ${formatCurrency(item.total)}`).join('\n');
        const subjectPrefix = eventType === 'PAYMENT_APPROVED' ? '[PAGAMENTO CONFIRMADO]' : '[NOVO PEDIDO RECEBIDO]';
        const createdNotifications = [];

        for (const adminRecipient of STORE_CONFIG.adminNotificationRecipients) {
          const notifId = `mail_${order.orderNumber}_${adminRecipient.email.replace(/[^a-z0-9]/gi, '_')}_${Date.now()}`;
          const subject = `${subjectPrefix} ETIQUETA DE ENVIO ${order.orderNumber} — ${order.customer.fullName}`;
          const shippingLabelBlock =
            order.deliveryMethod === 'pickup'
              ? [
                  `==================================================`,
                  `ETIQUETA DE RETIRADA — CYBELE IMPORTS`,
                  `==================================================`,
                  `PEDIDO: ${order.orderNumber}`,
                  `DESTINATÁRIO: ${order.customer.fullName}`,
                  `TELEFONE / WHATSAPP: ${order.customer.phone}`,
                  `E-MAIL: ${order.customer.email}`,
                  `MODALIDADE: Retirada Combinada via WhatsApp`,
                  `CONTEÚDO:\n${itemsSummaryText}`,
                  `VALOR TOTAL: ${formatCurrency(order.total)}`,
                  `PAGAMENTO: ${paymentLabel} (${statusLabel || order.paymentStatus})`,
                  `DATA/HORA: ${formattedDateTime}`,
                  `==================================================`,
                ].join('\n')
              : [
                  `==================================================`,
                  `ETIQUETA DE ENVIO — CYBELE IMPORTS`,
                  `==================================================`,
                  `PEDIDO: ${order.orderNumber}`,
                  `DESTINATÁRIO: ${order.customer.fullName}`,
                  order.customer.cpf ? `CPF: ${order.customer.cpf}` : null,
                  `TELEFONE / WHATSAPP: ${order.customer.phone}`,
                  `ENDEREÇO: ${order.customer.address}, Nº ${order.customer.number}`,
                  order.customer.complement ? `COMPLEMENTO: ${order.customer.complement}` : null,
                  `CEP: ${order.customer.cep}`,
                  `--------------------------------------------------`,
                  `CONTEÚDO / DECLARAÇÃO DE ITENS:`,
                  itemsSummaryText,
                  `--------------------------------------------------`,
                  `VALOR TOTAL: ${formatCurrency(order.total)}`,
                  `PAGAMENTO: ${paymentLabel} (${statusLabel || order.paymentStatus})`,
                  `REMETENTE: CYBELE IMPORTS • WhatsApp +55 15 99786-0198`,
                  `DATA/HORA: ${formattedDateTime}`,
                  `==================================================`,
                ].filter(Boolean).join('\n');

          const bodyText = `Olá, ${adminRecipient.name}!\nSegue abaixo a etiqueta com os dados completos para postagem/separação:\n\n${shippingLabelBlock}`;
          let deliveryState = 'Pronto para envio (Webhook/Resend/EmailJS)';
          if (emailWebhookUrl && emailWebhookUrl.startsWith('http')) {
            try {
              const res = await fetch(emailWebhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ to: adminRecipient.email, recipientName: adminRecipient.name, subject, text: bodyText, order, eventType, dateTime: formattedDateTime }),
              });
              deliveryState = res.ok ? 'Enviado via Webhook' : 'Pendente (Falha no Webhook)';
            } catch {
              deliveryState = 'Pendente (Erro de conexão Webhook)';
            }
          }

          createdNotifications.push({
            id: notifId,
            targetType: 'admin',
            recipientName: adminRecipient.name,
            recipientEmail: adminRecipient.email,
            orderNumber: order.orderNumber,
            customerName: order.customer.fullName,
            customerCpf: order.customer.cpf || '',
            customerPhone: order.customer.phone,
            customerEmail: order.customer.email,
            deliveryMethod: order.deliveryMethod,
            streetAddress: order.customer.address || '',
            streetNumber: order.customer.number || '',
            complement: order.customer.complement || '',
            cep: order.customer.cep || '',
            items: order.items,
            total: formatCurrency(order.total),
            address: formattedAddress,
            paymentMethod: paymentLabel,
            paymentStatus: statusLabel || order.paymentStatus,
            dateTime: formattedDateTime,
            subject,
            shippingLabelBlock,
            bodyText,
            status: deliveryState,
            timestamp: Date.now(),
          });
        }

        createdNotifications.push({
          id: `mail_client_${order.orderNumber}_${Date.now()}`,
          targetType: 'customer',
          recipientName: order.customer.fullName,
          recipientEmail: order.customer.email,
          orderNumber: order.orderNumber,
          customerName: order.customer.fullName,
          customerPhone: order.customer.phone,
          customerEmail: order.customer.email,
          items: order.items,
          total: formatCurrency(order.total),
          address: formattedAddress,
          paymentMethod: paymentLabel,
          paymentStatus: statusLabel || order.paymentStatus,
          dateTime: formattedDateTime,
          subject: `CYBELE IMPORTS — Confirmação do Pedido ${order.orderNumber}`,
          bodyText: `Olá, ${order.customer.fullName}!\nRecebemos o seu pedido ${order.orderNumber} na CYBELE IMPORTS.\nTotal: ${formatCurrency(order.total)} • Pagamento: ${paymentLabel}`,
          status: 'Pronto para envio (Webhook/Resend/EmailJS)',
          timestamp: Date.now() - 1,
        });

        setEmailLogs((prev) => [...createdNotifications, ...prev]);
      };

      const handleCreateOrder = async (e) => {
        e.preventDefault();
        const cleanCustomer = {
          fullName: sanitizeText(checkoutForm.fullName),
          email: sanitizeText(checkoutForm.email).toLowerCase(),
          phone: sanitizeText(checkoutForm.phone),
          cpf: sanitizeText(checkoutForm.cpf),
          cep: sanitizeText(checkoutForm.cep),
          address: sanitizeText(checkoutForm.address),
          number: sanitizeText(checkoutForm.number),
          complement: sanitizeText(checkoutForm.complement),
        };

        if (!cleanCustomer.fullName || !cleanCustomer.email || !cleanCustomer.phone || (deliveryMethod === 'shipping' && (!cleanCustomer.cep || !cleanCustomer.address))) {
          showToast('Preencha todos os campos obrigatórios para entrega.', 'error');
          return;
        }

        const orderNumber = `CYB-${new Date().getFullYear()}-${String(Math.floor(1000 + Math.random() * 9000))}`;
        const newOrder = {
          id: orderNumber,
          orderNumber,
          customerUid: customerProfile?.uid || null,
          customer: cleanCustomer,
          items: cart.map((item) => ({ id: item.id, name: item.name, quantity: item.quantity, unitPrice: item.price, total: item.price * item.quantity })),
          subtotal,
          discount: discountAmount,
          couponCode: appliedCoupon?.code || null,
          shippingCost,
          deliveryMethod,
          total: grandTotal,
          paymentMethod: checkoutForm.paymentMethod,
          paymentStatus: checkoutForm.paymentMethod === 'pix' ? 'Aguardando pagamento PIX' : 'Aguardando link de pagamento',
          deliveryStatus: 'Aguardando pagamento',
          pixCopyPaste:
            checkoutForm.paymentMethod === 'pix'
              ? buildPixEmvPayload({ pixKey: STORE_CONFIG.pixKey, merchantName: STORE_CONFIG.pixMerchantName, merchantCity: STORE_CONFIG.pixMerchantCity, amount: grandTotal, txid: orderNumber })
              : null,
          webhookVerified: false,
          createdAt: new Date().toISOString(),
          timestamp: Date.now(),
        };

        setProducts((prev) =>
          prev.map((prod) => {
            const orderedItem = cart.find((c) => c.id === prod.id);
            return orderedItem ? { ...prod, stock: Math.max(0, prod.stock - orderedItem.quantity) } : prod;
          })
        );
        setOrders((prev) => [newOrder, ...prev]);

        await dispatchOrderEmailNotifications({ order: newOrder, eventType: 'NEW_ORDER', statusLabel: newOrder.paymentStatus });

        setCompletedOrder(newOrder);
        setCart([]);
        setAppliedCoupon(null);
        setCheckoutStep(3);
        showToast(`Pedido ${orderNumber} registrado e notificado às administradoras!`);
      };

      const handleConfirmOrderPayment = async (orderId) => {
        if (!isAdminAuthenticated) return;
        const targetOrder = orders.find((o) => o.id === orderId);
        if (!targetOrder) return;
        const updatedOrder = { ...targetOrder, paymentStatus: 'Pago (Confirmado)', deliveryStatus: 'Em separação', webhookVerified: true };
        setOrders((prev) => prev.map((o) => (o.id === orderId ? updatedOrder : o)));
        await dispatchOrderEmailNotifications({ order: updatedOrder, eventType: 'PAYMENT_APPROVED', statusLabel: 'PAGAMENTO CONFIRMADO' });
        showToast(`Pagamento do pedido ${orderId} confirmado!`);
      };

      const handleUpdateDeliveryStatus = (orderId, nextStatus) => {
        if (!isAdminAuthenticated) return;
        setOrders((prev) => prev.map((o) => (o.id === orderId ? { ...o, deliveryStatus: nextStatus } : o)));
        showToast(`Status atualizado para "${nextStatus}".`);
      };

      const adminMetrics = useMemo(() => {
        const totalOrders = orders.length;
        const pendingOrders = orders.filter((o) => !o.webhookVerified).length;
        const approvedOrders = orders.filter((o) => o.webhookVerified).length;
        const totalSales = orders.filter((o) => o.webhookVerified).reduce((acc, o) => acc + (Number(o.total) || 0), 0);
        return { totalOrders, pendingOrders, approvedOrders, totalSales, totalProducts: products.length };
      }, [orders, products]);

      const customerOrders = useMemo(() => {
        if (!customerProfile) return [];
        return orders.filter((o) => o.customerUid === customerProfile.uid || o.customer?.email?.toLowerCase() === customerProfile.email?.toLowerCase());
      }, [orders, customerProfile]);

      const scrollToCatalog = (category = 'Todos', editorial = 'all') => {
        setActiveView('store');
        setSelectedCategory(category);
        setEditorialFilter(editorial);
        setTimeout(() => catalogSectionRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
      };

      return (
        <div className="min-h-screen bg-[#FFFFFF] text-[#39291F] font-sans antialiased">
          {toast && (
            <div className="fixed top-20 right-4 z-[90] max-w-sm">
              <div className="flex items-center gap-3 px-5 py-3.5 rounded-full shadow-xl border bg-[#39291F] text-[#F3EBDD] border-[#E5D5C0]/30">
                <Icon name="checkCircle" className="w-4 h-4 text-[#E5D5C0] shrink-0" />
                <span className="text-xs font-medium tracking-wide">{toast.message}</span>
              </div>
            </div>
          )}

          {/* Barra Superior */}
          <div className="bg-[#39291F] text-[#F3EBDD] text-[11px] tracking-[0.18em] uppercase py-2.5 px-4 text-center">
            <span>Curadoria Internacional • Paraguai, Argentina &amp; Destinos Exclusivos</span>
          </div>

          {/* Cabeçalho */}
          <header className="sticky top-0 z-40 bg-[#FFFFFF]/95 backdrop-blur-md border-b border-[#E5D5C0]/50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
              <nav className="hidden lg:flex items-center gap-7 text-xs tracking-[0.15em] uppercase text-[#70513D]">
                <button onClick={() => { setActiveView('store'); setSelectedCategory('Todos'); setEditorialFilter('all'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="hover:text-[#39291F] font-medium">Início</button>
                <button onClick={() => scrollToCatalog('Todos', 'all')} className="hover:text-[#39291F] font-medium">Catálogo</button>
                <button onClick={() => scrollToCatalog('Perfumes', 'all')} className="hover:text-[#39291F]">Perfumes</button>
                <button onClick={() => scrollToCatalog('Ofertas', 'promo')} className="hover:text-[#39291F]">Ofertas</button>
              </nav>

              <button onClick={() => { setActiveView('store'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="flex flex-col items-center justify-center text-center">
                <span className="font-editorial text-2xl sm:text-3xl tracking-[0.22em] font-semibold text-[#39291F] leading-none">CYBELE IMPORTS</span>
                <span className="text-[9px] tracking-[0.35em] text-[#77716B] uppercase mt-1">{STORE_CONFIG.subtitle}</span>
              </button>

              <div className="flex items-center gap-2 sm:gap-3">
                <div className="hidden md:flex items-center bg-[#F3EBDD]/70 border border-[#E5D5C0] rounded-full px-3.5 py-1.5 w-48 lg:w-56 focus-within:bg-[#FFFFFF] focus-within:border-[#70513D]">
                  <Icon name="search" className="w-3.5 h-3.5 text-[#77716B] mr-2 shrink-0" />
                  <input type="text" value={searchQuery} onChange={(e) => { setSearchQuery(e.target.value); if (activeView !== 'store') setActiveView('store'); }} placeholder="Buscar importados..." className="bg-transparent text-xs text-[#39291F] placeholder-[#77716B] focus:outline-none w-full" />
                  {searchQuery && <button onClick={() => setSearchQuery('')} className="text-[#77716B] hover:text-[#39291F]"><Icon name="x" className="w-3.5 h-3.5" /></button>}
                </div>

                <button
                  onClick={() => {
                    if (isAdminAuthenticated) setActiveView(activeView === 'admin' ? 'store' : 'admin');
                    else if (customerProfile) setActiveView(activeView === 'account' ? 'store' : 'account');
                    else { setAuthModalMode('login'); setAuthError(''); setIsAccountModalOpen(true); }
                  }}
                  className={`p-2.5 rounded-full transition-all flex items-center gap-2 ${
                    isAdminAuthenticated
                      ? 'bg-[#39291F] text-[#E5D5C0] border border-[#E5D5C0]/40 px-3.5'
                      : customerProfile
                      ? 'bg-[#F3EBDD] text-[#39291F] border border-[#70513D]/25 px-3.5'
                      : 'text-[#39291F] hover:bg-[#F3EBDD]/80'
                  }`}
                >
                  <Icon name={isAdminAuthenticated ? 'shield' : 'user'} className="w-4 h-4" />
                  <span className="hidden sm:inline text-[10px] tracking-widest uppercase font-medium">
                    {isAdminAuthenticated ? (activeView === 'admin' ? 'Ver Vitrine' : 'Proprietária • Painel') : customerProfile ? `Cliente • ${customerProfile.name.split(' ')[0]}` : 'Entrar'}
                  </span>
                </button>

                <button onClick={() => setIsCartOpen(true)} className="relative p-2.5 rounded-full text-[#39291F] hover:bg-[#F3EBDD]/80">
                  <Icon name="bag" className="w-5 h-5" />
                  {cartItemsCount > 0 && (
                    <span className="absolute -top-0.5 -right-0.5 w-5 h-5 rounded-full bg-[#39291F] text-[#FFFFFF] text-[10px] font-semibold flex items-center justify-center">{cartItemsCount}</span>
                  )}
                </button>
              </div>
            </div>

            <div className="md:hidden px-4 pb-3">
              <div className="flex items-center bg-[#F3EBDD]/70 border border-[#E5D5C0] rounded-full px-4 py-2">
                <Icon name="search" className="w-4 h-4 text-[#77716B] mr-2" />
                <input type="text" value={searchQuery} onChange={(e) => { setSearchQuery(e.target.value); if (activeView !== 'store') setActiveView('store'); }} placeholder="Pesquisar perfumes, cosméticos, relógios..." className="bg-transparent text-xs text-[#39291F] placeholder-[#77716B] focus:outline-none w-full" />
              </div>
            </div>
          </header>

          {/* =================================================================== */}
          {/* VIEW 1: PAINEL ADMINISTRATIVO DA PROPRIETÁRIA                       */}
          {/* =================================================================== */}
          {activeView === 'admin' && isAdminAuthenticated && (
            <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
              <div className="bg-[#39291F] text-[#F3EBDD] rounded-[2.25rem] p-6 sm:p-8 mb-8 shadow-lg flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div>
                  <div className="flex flex-wrap items-center gap-2.5 mb-2">
                    <span className="px-3 py-0.5 rounded-full bg-[#E5D5C0] text-[#39291F] font-semibold text-[10px] tracking-[0.2em] uppercase">Proprietária</span>
                    <span className="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-[#FFFFFF]/10 text-[10px] text-[#E5D5C0]">
                      <Icon name="database" className="w-3 h-3" /> Armazenamento Ativo
                    </span>
                  </div>
                  <h1 className="font-editorial text-3xl sm:text-4xl text-[#FFFFFF]">Painel Administrativo — Cybele Imports</h1>
                  <p className="text-xs text-[#E5D5C0]/80 mt-1">
                    Notificações em etiqueta enviadas para <strong className="text-[#FFFFFF]">iranhigorpanizzon@gmail.com</strong> e <strong className="text-[#FFFFFF]">cibellefogaca@gamil.com</strong>
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-3">
                  <button onClick={() => setActiveView('store')} className="px-5 py-2.5 rounded-full bg-[#F3EBDD] text-[#39291F] text-xs font-medium tracking-wider uppercase hover:bg-[#FFFFFF]">Ver Loja</button>
                  <button onClick={handleLogout} className="px-5 py-2.5 rounded-full border border-[#E5D5C0]/40 text-[#F3EBDD] text-xs font-medium tracking-wider uppercase hover:bg-[#FFFFFF]/10 flex items-center gap-2">
                    <Icon name="logout" className="w-3.5 h-3.5" /> Sair
                  </button>
                </div>
              </div>

              {/* KPIs */}
              <div className="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
                <div className="bg-[#F3EBDD]/60 border border-[#E5D5C0] rounded-3xl p-5"><p className="text-[11px] uppercase tracking-wider text-[#77716B]">Pedidos Recebidos</p><p className="font-editorial text-3xl font-semibold text-[#39291F] mt-1">{adminMetrics.totalOrders}</p></div>
                <div className="bg-[#F3EBDD]/60 border border-[#E5D5C0] rounded-3xl p-5"><p className="text-[11px] uppercase tracking-wider text-[#77716B]">Pedidos Pendentes</p><p className="font-editorial text-3xl font-semibold text-[#70513D] mt-1">{adminMetrics.pendingOrders}</p></div>
                <div className="bg-[#F3EBDD]/60 border border-[#E5D5C0] rounded-3xl p-5"><p className="text-[11px] uppercase tracking-wider text-[#77716B]">Pagamentos Aprovados</p><p className="font-editorial text-3xl font-semibold text-[#39291F] mt-1">{adminMetrics.approvedOrders}</p></div>
                <div className="bg-[#F3EBDD]/60 border border-[#E5D5C0] rounded-3xl p-5"><p className="text-[11px] uppercase tracking-wider text-[#77716B]">Total de Vendas</p><p className="font-editorial text-2xl sm:text-3xl font-semibold text-[#39291F] mt-1">{formatCurrency(adminMetrics.totalSales)}</p></div>
                <div className="col-span-2 lg:col-span-1 bg-[#F3EBDD]/60 border border-[#E5D5C0] rounded-3xl p-5"><p className="text-[11px] uppercase tracking-wider text-[#77716B]">Produtos Ativos</p><p className="font-editorial text-3xl font-semibold text-[#39291F] mt-1">{adminMetrics.totalProducts}</p></div>
              </div>

              {/* Abas */}
              <div className="flex flex-wrap gap-2 mb-8">
                <button onClick={() => setAdminTab('products')} className={`px-6 py-3 rounded-full text-xs uppercase tracking-widest font-medium ${adminTab === 'products' ? 'bg-[#39291F] text-[#FFFFFF]' : 'bg-[#F3EBDD] text-[#70513D]'}`}>+ Adicionar / Gerenciar Produtos ({products.length})</button>
                <button onClick={() => setAdminTab('orders')} className={`px-6 py-3 rounded-full text-xs uppercase tracking-widest font-medium ${adminTab === 'orders' ? 'bg-[#39291F] text-[#FFFFFF]' : 'bg-[#F3EBDD] text-[#70513D]'}`}>Pedidos &amp; Etiquetas ({orders.length})</button>
                <button onClick={() => setAdminTab('settings')} className={`px-6 py-3 rounded-full text-xs uppercase tracking-widest font-medium ${adminTab === 'settings' ? 'bg-[#39291F] text-[#FFFFFF]' : 'bg-[#F3EBDD] text-[#70513D]'}`}>Cupons &amp; Frete</button>
              </div>

              {/* ABA PRODUTOS */}
              {adminTab === 'products' && (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                  <div className="lg:col-span-5 bg-[#F3EBDD]/45 border border-[#E5D5C0] rounded-[2rem] p-6 sm:p-8 h-fit">
                    <h2 className="font-editorial text-2xl text-[#39291F] mb-1">{editingProductId ? 'Editar Produto' : 'Cadastrar Novo Produto'}</h2>
                    <p className="text-xs text-[#77716B] mb-6">Adicione fotografias, valores reais e estoque. A vitrine atualiza na hora.</p>

                    <form onSubmit={handleSaveProduct} className="space-y-4">
                      <div>
                        <label className="block text-xs font-medium text-[#39291F] mb-2">Fotografia do Produto</label>
                        <div className="flex flex-col gap-3">
                          <label className="cursor-pointer flex items-center justify-center gap-2 px-4 py-3.5 rounded-2xl border-2 border-dashed border-[#70513D]/35 bg-[#FFFFFF] hover:bg-[#F3EBDD]/50 text-xs font-medium text-[#70513D]">
                            <Icon name="upload" className="w-4 h-4" />
                            <span>Escolher Foto do Celular / Computador</span>
                            <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                          </label>
                          <input type="url" value={productForm.image} onChange={(e) => setProductForm((p) => ({ ...p, image: e.target.value }))} placeholder="Ou cole o link (URL) da fotografia..." className="w-full px-4 py-2.5 rounded-2xl bg-[#FFFFFF] border border-[#E5D5C0] text-xs" />
                        </div>
                        {productForm.image && (
                          <div className="mt-3 relative w-28 h-28 rounded-2xl overflow-hidden border border-[#E5D5C0] bg-[#FFFFFF]">
                            <img src={productForm.image} alt="Prévia" className="w-full h-full object-cover" />
                            <button type="button" onClick={() => setProductForm((p) => ({ ...p, image: '' }))} className="absolute top-1.5 right-1.5 p-1 rounded-full bg-[#39291F]/80 text-[#FFFFFF]"><Icon name="x" className="w-3 h-3" /></button>
                          </div>
                        )}
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-[#39291F] mb-1.5">Nome do Produto *</label>
                        <input type="text" required value={productForm.name} onChange={(e) => setProductForm((p) => ({ ...p, name: e.target.value }))} placeholder="Ex: Perfume Importado Eau de Parfum" className="w-full px-4 py-3 rounded-2xl bg-[#FFFFFF] border border-[#E5D5C0] text-xs" />
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-[#39291F] mb-1.5">Descrição Detalhada</label>
                        <textarea rows="3" value={productForm.description} onChange={(e) => setProductForm((p) => ({ ...p, description: e.target.value }))} placeholder="Notas olfativas, especificações ou detalhes..." className="w-full px-4 py-3 rounded-2xl bg-[#FFFFFF] border border-[#E5D5C0] text-xs"></textarea>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-medium text-[#39291F] mb-1.5">Preço (R$) *</label>
                          <input type="number" step="0.01" min="0.01" required value={productForm.price} onChange={(e) => setProductForm((p) => ({ ...p, price: e.target.value }))} placeholder="0,00" className="w-full px-4 py-3 rounded-2xl bg-[#FFFFFF] border border-[#E5D5C0] text-xs" />
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-[#39291F] mb-1.5">Preço Promocional</label>
                          <input type="number" step="0.01" min="0" value={productForm.promoPrice} onChange={(e) => setProductForm((p) => ({ ...p, promoPrice: e.target.value }))} placeholder="0,00" className="w-full px-4 py-3 rounded-2xl bg-[#FFFFFF] border border-[#E5D5C0] text-xs" />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-medium text-[#39291F] mb-1.5">Categoria</label>
                          <select value={productForm.category} onChange={(e) => setProductForm((p) => ({ ...p, category: e.target.value }))} className="w-full px-4 py-3 rounded-2xl bg-[#FFFFFF] border border-[#E5D5C0] text-xs">
                            {CATEGORIES.filter((c) => c.id !== 'Todos' && c.id !== 'Ofertas').map((cat) => (
                              <option key={cat.id} value={cat.id}>{cat.id}</option>
                            ))}
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-[#39291F] mb-1.5">Estoque Disponível</label>
                          <input type="number" min="0" required value={productForm.stock} onChange={(e) => setProductForm((p) => ({ ...p, stock: e.target.value }))} className="w-full px-4 py-3 rounded-2xl bg-[#FFFFFF] border border-[#E5D5C0] text-xs" />
                        </div>
                      </div>

                      <div className="flex flex-wrap gap-4 pt-1 text-xs text-[#39291F]">
                        <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={productForm.isFeatured} onChange={(e) => setProductForm((p) => ({ ...p, isFeatured: e.target.checked }))} /><span>Destaque</span></label>
                        <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={productForm.isNew} onChange={(e) => setProductForm((p) => ({ ...p, isNew: e.target.checked }))} /><span>Novidade</span></label>
                        <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={productForm.isBestSeller} onChange={(e) => setProductForm((p) => ({ ...p, isBestSeller: e.target.checked }))} /><span>Mais Vendido</span></label>
                      </div>

                      <div className="flex items-center gap-3 pt-2">
                        <button type="submit" className="flex-1 py-3.5 px-6 rounded-full bg-[#39291F] text-[#FFFFFF] text-xs font-medium uppercase tracking-widest hover:bg-[#70513D]">
                          {editingProductId ? 'Salvar Alterações' : 'Publicar na Vitrine'}
                        </button>
                        {editingProductId && (
                          <button type="button" onClick={() => { setEditingProductId(null); setProductForm({ name: '', description: '', price: '', promoPrice: '', stock: '1', category: 'Perfumes', image: '', isFeatured: true, isNew: true, isBestSeller: false }); }} className="py-3.5 px-5 rounded-full bg-[#FFFFFF] border border-[#E5D5C0] text-[#39291F] text-xs uppercase">Cancelar</button>
                        )}
                      </div>
                    </form>
                  </div>

                  <div className="lg:col-span-7 space-y-4">
                    <h2 className="font-editorial text-2xl text-[#39291F]">Produtos Cadastrados ({products.length})</h2>
                    {products.length === 0 ? (
                      <div className="bg-[#F3EBDD]/40 border border-[#E5D5C0] rounded-[2rem] p-10 text-center">
                        <Icon name="package" className="w-10 h-10 text-[#70513D] mx-auto mb-3" />
                        <p className="font-editorial text-2xl text-[#39291F]">Nenhum produto cadastrado ainda</p>
                        <p className="text-xs text-[#77716B] mt-1">Use o formulário ao lado para publicar seus primeiros produtos.</p>
                      </div>
                    ) : (
                      <div className="space-y-3">
                        {products.map((product) => (
                          <div key={product.id} className="bg-[#FFFFFF] border border-[#E5D5C0] rounded-3xl p-4 flex items-center justify-between gap-4">
                            <div className="flex items-center gap-4 min-w-0">
                              <div className="w-16 h-16 rounded-2xl bg-[#F3EBDD] overflow-hidden shrink-0 flex items-center justify-center">
                                {product.image ? <img src={product.image} alt={product.name} className="w-full h-full object-cover" /> : <Icon name="sparkles" className="w-5 h-5 text-[#70513D]" />}
                              </div>
                              <div className="min-w-0">
                                <span className="text-[10px] uppercase tracking-wider text-[#77716B]">{product.category} • Estoque: {product.stock}</span>
                                <h3 className="font-medium text-sm text-[#39291F] truncate">{product.name}</h3>
                                <div className="flex items-center gap-2 mt-0.5 text-xs">
                                  {product.promoPrice && product.promoPrice < product.price ? (
                                    <>
                                      <span className="font-semibold text-[#39291F]">{formatCurrency(product.promoPrice)}</span>
                                      <span className="line-through text-[#77716B]">{formatCurrency(product.price)}</span>
                                    </>
                                  ) : (
                                    <span className="font-semibold text-[#39291F]">{formatCurrency(product.price)}</span>
                                  )}
                                </div>
                              </div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                              <button onClick={() => handleEditProduct(product)} className="p-2.5 rounded-full bg-[#F3EBDD] text-[#39291F] hover:bg-[#E5D5C0]"><Icon name="edit" className="w-4 h-4" /></button>
                              <button onClick={() => handleDeleteProduct(product.id)} className="p-2.5 rounded-full bg-[#F3EBDD] text-[#70513D] hover:bg-[#39291F] hover:text-[#FFFFFF]"><Icon name="trash" className="w-4 h-4" /></button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* ABA PEDIDOS & ETIQUETAS */}
              {adminTab === 'orders' && (
                <div className="space-y-6">
                  <div className="bg-[#F3EBDD]/60 border border-[#E5D5C0] rounded-[2rem] p-6 sm:p-8">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
                      <div>
                        <div className="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-[#39291F]">
                          <Icon name="mail" className="w-4 h-4 text-[#70513D]" /> Caixa de Notificações em Formato de Etiqueta
                        </div>
                        <p className="text-xs text-[#77716B] mt-1">Notificações individuais geradas para <strong>iranhigorpanizzon@gmail.com</strong> e <strong>cibellefogaca@gamil.com</strong>.</p>
                      </div>
                      <span className="px-3.5 py-1.5 rounded-full bg-[#39291F] text-[#E5D5C0] text-[10px] uppercase tracking-wider font-medium self-start">{emailLogs.length} registro(s)</span>
                    </div>

                    {emailLogs.length > 0 && (
                      <div className="space-y-4 max-h-[540px] overflow-y-auto pr-1">
                        {emailLogs.map((log) => (
                          <div key={log.id} className="bg-[#FFFFFF] border border-[#E5D5C0] rounded-3xl p-5 text-xs space-y-3">
                            <div className="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-[#F3EBDD]">
                              <div className="flex flex-wrap items-center gap-2">
                                <span className={`px-2.5 py-0.5 rounded-full text-[10px] uppercase tracking-wider font-semibold ${log.targetType === 'admin' ? 'bg-[#39291F] text-[#E5D5C0]' : 'bg-[#F3EBDD] text-[#70513D]'}`}>
                                  {log.targetType === 'admin' ? 'Administradora' : 'Cliente'}
                                </span>
                                <strong className="text-[#39291F]">{log.recipientEmail}</strong>
                                <span className="text-[#77716B]">• {log.dateTime}</span>
                              </div>
                              <div className="flex flex-wrap items-center gap-2">
                                {log.shippingLabelBlock && (
                                  <button type="button" onClick={() => { navigator.clipboard?.writeText(log.shippingLabelBlock); showToast('Etiqueta copiada!'); }} className="px-3 py-1 rounded-full bg-[#F3EBDD] text-[#39291F] border border-[#E5D5C0] text-[10px] uppercase tracking-wider font-medium">Copiar Etiqueta</button>
                                )}
                                <a href={`mailto:${encodeURIComponent(log.recipientEmail)}?subject=${encodeURIComponent(log.subject)}&body=${encodeURIComponent(log.bodyText || '')}`} className="px-3 py-1 rounded-full bg-[#39291F] text-[#FFFFFF] text-[10px] uppercase tracking-wider">Abrir no E-mail</a>
                              </div>
                            </div>

                            {log.targetType === 'admin' ? (
                              <div className="rounded-2xl border-2 border-dashed border-[#70513D]/45 bg-[#F3EBDD]/35 p-4 space-y-3">
                                <div className="flex flex-wrap items-center justify-between gap-2 border-b border-[#E5D5C0] pb-2">
                                  <div>
                                    <span className="text-[10px] font-bold uppercase tracking-[0.2em] text-[#70513D]">{log.deliveryMethod === 'pickup' ? 'Etiqueta de Retirada' : 'Etiqueta de Envio / Postagem'}</span>
                                    <p className="font-editorial text-lg font-semibold text-[#39291F]">CYBELE IMPORTS • Pedido {log.orderNumber}</p>
                                  </div>
                                  <div className="text-right">
                                    <span className="px-2.5 py-1 rounded-full bg-[#39291F] text-[#E5D5C0] text-[10px] font-semibold">{log.total}</span>
                                    <p className="text-[10px] text-[#77716B] mt-1">{log.paymentMethod} • {log.paymentStatus}</p>
                                  </div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-[11px]">
                                  <div className="bg-[#FFFFFF] rounded-xl p-3 border border-[#E5D5C0]/80 space-y-1">
                                    <p className="text-[10px] uppercase tracking-wider font-bold text-[#70513D]">Destinatário</p>
                                    <p className="font-semibold text-[#39291F] text-xs">{log.customerName}</p>
                                    {log.customerCpf && <p className="text-[#77716B]">CPF: {log.customerCpf}</p>}
                                    <p className="text-[#39291F]">Tel/WhatsApp: {log.customerPhone}</p>
                                    <p className="text-[#77716B]">E-mail: {log.customerEmail}</p>
                                  </div>
                                  <div className="bg-[#FFFFFF] rounded-xl p-3 border border-[#E5D5C0]/80 space-y-1">
                                    <p className="text-[10px] uppercase tracking-wider font-bold text-[#70513D]">Endereço de Entrega</p>
                                    {log.deliveryMethod === 'pickup' ? (
                                      <p className="font-medium text-[#39291F]">Retirada Combinada via WhatsApp</p>
                                    ) : (
                                      <>
                                        <p className="font-medium text-[#39291F]">{log.streetAddress ? `${log.streetAddress}, Nº ${log.streetNumber}` : log.address}</p>
                                        {log.complement && <p className="text-[#77716B]">Complemento: {log.complement}</p>}
                                        {log.cep && <p className="font-semibold text-[#39291F]">CEP: {log.cep}</p>}
                                      </>
                                    )}
                                  </div>
                                </div>
                                <div className="bg-[#FFFFFF] rounded-xl p-3 border border-[#E5D5C0]/80 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-[11px]">
                                  <div>
                                    <span className="text-[10px] uppercase tracking-wider font-bold text-[#70513D] block">Conteúdo</span>
                                    <span className="text-[#39291F]">{log.items?.map((item) => `${item.quantity}x ${item.name}`).join(' • ')}</span>
                                  </div>
                                  <span className="text-[10px] text-[#77716B] shrink-0">Remetente: CYBELE IMPORTS</span>
                                </div>
                              </div>
                            ) : (
                              <p className="text-[11px] text-[#77716B]">Confirmação gerada para o cliente: {log.orderNumber} • {log.total}</p>
                            )}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {orders.length === 0 ? (
                    <div className="bg-[#F3EBDD]/40 border border-[#E5D5C0] rounded-[2rem] p-12 text-center">
                      <Icon name="bag" className="w-10 h-10 text-[#70513D] mx-auto mb-3" />
                      <p className="font-editorial text-2xl text-[#39291F]">Nenhum pedido registrado ainda</p>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {orders.map((order) => (
                        <div key={order.id} className="bg-[#FFFFFF] border border-[#E5D5C0] rounded-[2rem] p-6">
                          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-[#F3EBDD]">
                            <div>
                              <div className="flex flex-wrap items-center gap-2">
                                <span className="font-semibold text-sm text-[#39291F]">{order.orderNumber}</span>
                                <span className={`px-3 py-0.5 rounded-full text-[10px] uppercase tracking-wider font-medium ${order.webhookVerified ? 'bg-[#39291F] text-[#E5D5C0]' : 'bg-[#F3EBDD] text-[#70513D]'}`}>{order.paymentStatus}</span>
                              </div>
                              <p className="text-xs text-[#77716B] mt-1">Cliente: <strong className="text-[#39291F]">{order.customer?.fullName}</strong> • {order.customer?.phone}</p>
                            </div>
                            <div className="flex flex-wrap items-center gap-3">
                              {!order.webhookVerified && (
                                <button onClick={() => handleConfirmOrderPayment(order.id)} className="px-4 py-2 rounded-full bg-[#39291F] text-[#FFFFFF] text-[11px] uppercase tracking-wider font-medium">Confirmar Pagamento</button>
                              )}
                              <select value={order.deliveryStatus} onChange={(e) => handleUpdateDeliveryStatus(order.id, e.target.value)} className="px-4 py-2 rounded-full bg-[#F3EBDD] text-[#39291F] text-xs border border-[#E5D5C0]">
                                <option value="Aguardando pagamento">Aguardando pagamento</option>
                                <option value="Em separação">Em separação</option>
                                <option value="Enviado">Enviado</option>
                                <option value="Entregue">Entregue</option>
                              </select>
                            </div>
                          </div>
                          <div className="pt-4 flex flex-col sm:flex-row justify-between gap-2 text-xs">
                            <div className="text-[#77716B]">{order.items?.map((i) => `${i.quantity}x ${i.name}`).join(' • ')}</div>
                            <div className="font-semibold text-sm text-[#39291F]">Total: {formatCurrency(order.total)}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* ABA CUPONS & FRETE */}
              {adminTab === 'settings' && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div className="bg-[#F3EBDD]/45 border border-[#E5D5C0] rounded-[2rem] p-6 space-y-4">
                    <h3 className="font-editorial text-2xl text-[#39291F]">Frete &amp; Webhook de E-mail</h3>
                    <div>
                      <label className="block text-xs font-medium text-[#39291F] mb-1">Taxa Fixa de Entrega (R$)</label>
                      <input type="number" value={shippingConfig.flatRate} onChange={(e) => setShippingConfig((p) => ({ ...p, flatRate: parseFloat(e.target.value) || 0 }))} className="w-full px-4 py-3 rounded-2xl bg-[#FFFFFF] border border-[#E5D5C0] text-xs" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-[#39291F] mb-1">Frete Grátis a partir de (R$)</label>
                      <input type="number" value={shippingConfig.freeShippingMin} onChange={(e) => setShippingConfig((p) => ({ ...p, freeShippingMin: parseFloat(e.target.value) || 0 }))} className="w-full px-4 py-3 rounded-2xl bg-[#FFFFFF] border border-[#E5D5C0] text-xs" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-[#39291F] mb-1">URL Webhook de Disparo Automático (Opcional)</label>
                      <input type="url" value={emailWebhookUrl} onChange={(e) => { setEmailWebhookUrl(e.target.value); try { localStorage.setItem('cybele_email_webhook_v1', e.target.value); } catch {} }} placeholder="https://seu-webhook-email.com/notify" className="w-full px-4 py-3 rounded-2xl bg-[#FFFFFF] border border-[#E5D5C0] text-xs" />
                    </div>
                  </div>

                  <div className="bg-[#F3EBDD]/45 border border-[#E5D5C0] rounded-[2rem] p-6">
                    <h3 className="font-editorial text-2xl text-[#39291F] mb-4">Cupons Promocionais</h3>
                    <div className="flex gap-2 mb-4">
                      <input type="text" value={newCouponCode} onChange={(e) => setNewCouponCode(e.target.value.toUpperCase())} placeholder="Código (ex: VIP15)" className="flex-1 px-4 py-2.5 rounded-full bg-[#FFFFFF] border border-[#E5D5C0] text-xs" />
                      <input type="number" min="1" max="90" value={newCouponDiscount} onChange={(e) => setNewCouponDiscount(e.target.value)} className="w-20 px-3 py-2.5 rounded-full bg-[#FFFFFF] border border-[#E5D5C0] text-xs text-center" />
                      <button onClick={() => { if (!newCouponCode.trim()) return; setCoupons([...coupons, { code: newCouponCode.trim().toUpperCase(), discountPercent: Number(newCouponDiscount) || 10, active: true }]); setNewCouponCode(''); showToast('Cupom criado!'); }} className="px-5 py-2.5 rounded-full bg-[#39291F] text-[#FFFFFF] text-xs">Adicionar</button>
                    </div>
                    <div className="space-y-2">
                      {coupons.map((c, idx) => (
                        <div key={idx} className="flex items-center justify-between px-4 py-2.5 rounded-2xl bg-[#FFFFFF] border border-[#E5D5C0] text-xs">
                          <span><strong>{c.code}</strong> — {c.discountPercent}% OFF</span>
                          <button onClick={() => setCoupons(coupons.filter((_, i) => i !== idx))} className="text-[#77716B] hover:text-[#39291F]"><Icon name="trash" className="w-3.5 h-3.5" /></button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </main>
          )}

          {/* =================================================================== */}
          {/* VIEW 2: PAINEL DO CLIENTE                                           */}
          {/* =================================================================== */}
          {activeView === 'account' && customerProfile && !isAdminAuthenticated && (
            <main className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
              <div className="bg-[#F3EBDD]/65 border border-[#E5D5C0] rounded-[2.25rem] p-6 sm:p-10 mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-6">
                <div className="flex items-center gap-4">
                  <div className="w-16 h-16 rounded-full bg-[#39291F] text-[#E5D5C0] flex items-center justify-center font-editorial text-2xl">{customerProfile.name?.charAt(0).toUpperCase()}</div>
                  <div>
                    <span className="inline-block px-3 py-0.5 rounded-full bg-[#FFFFFF] text-[#70513D] text-[10px] uppercase tracking-widest font-medium mb-1">Perfil: Cliente VIP</span>
                    <h1 className="font-editorial text-3xl text-[#39291F]">{customerProfile.name}</h1>
                    <p className="text-xs text-[#77716B]">{customerProfile.email}</p>
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  <button onClick={() => setActiveView('store')} className="px-5 py-2.5 rounded-full bg-[#39291F] text-[#FFFFFF] text-xs uppercase tracking-wider">Voltar à Loja</button>
                  <button onClick={handleLogout} className="px-5 py-2.5 rounded-full border border-[#70513D]/30 text-[#39291F] text-xs uppercase tracking-wider flex items-center gap-1.5"><Icon name="logout" className="w-3.5 h-3.5" /> Sair</button>
                </div>
              </div>

              <h2 className="font-editorial text-2xl sm:text-3xl text-[#39291F] mb-5">Meus Pedidos ({customerOrders.length})</h2>
              {customerOrders.length === 0 ? (
                <div className="bg-[#FFFFFF] border border-[#E5D5C0] rounded-[2rem] p-10 text-center">
                  <p className="font-editorial text-2xl text-[#39291F]">Você ainda não possui pedidos realizados</p>
                  <button onClick={() => scrollToCatalog('Todos', 'all')} className="mt-4 px-7 py-3 rounded-full bg-[#39291F] text-[#FFFFFF] text-xs uppercase tracking-widest">Explorar Produtos</button>
                </div>
              ) : (
                <div className="space-y-4">
                  {customerOrders.map((order) => (
                    <div key={order.id} className="bg-[#FFFFFF] border border-[#E5D5C0] rounded-[2rem] p-6">
                      <div className="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-[#F3EBDD]">
                        <span className="font-semibold text-sm text-[#39291F]">Pedido {order.orderNumber}</span>
                        <span className="px-3.5 py-1 rounded-full bg-[#F3EBDD] text-[#39291F] text-xs font-medium">{order.deliveryStatus}</span>
                      </div>
                      <div className="pt-3 flex justify-between text-xs">
                        <span className="text-[#77716B]">{order.items?.map((i) => `${i.quantity}x ${i.name}`).join(' • ')}</span>
                        <span className="font-semibold text-sm text-[#39291F]">{formatCurrency(order.total)}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}

          {/* =================================================================== */}
          {/* VIEW 3: VITRINE PRINCIPAL                                           */}
          {/* =================================================================== */}
          {activeView === 'store' && (
            <main>
              <section className="px-4 sm:px-6 lg:px-8 pt-6 pb-8">
                <div className="max-w-7xl mx-auto relative overflow-hidden rounded-[2.5rem] bg-[#39291F] text-[#FFFFFF] px-6 py-16 sm:px-14 sm:py-24 lg:py-28 shadow-xl">
                  <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=1800&q=85" alt="Perfume de Luxo Cybele Imports" className="absolute inset-0 w-full h-full object-cover object-center opacity-55" />
                  <div className="absolute inset-0 bg-gradient-to-r from-[#39291F]/95 via-[#39291F]/75 to-[#39291F]/30 pointer-events-none" />
                  <div className="relative z-10 max-w-2xl">
                    <span className="inline-block px-4 py-1.5 rounded-full bg-[#FFFFFF]/15 border border-[#E5D5C0]/30 text-[#E5D5C0] text-[10px] tracking-[0.25em] uppercase mb-6">Curadoria Exclusiva • Cybele Imports</span>
                    <h1 className="font-editorial text-4xl sm:text-5xl lg:text-6xl font-medium leading-[1.12] text-[#FFFFFF] mb-6">Descubra o mundo através dos importados.</h1>
                    <p className="text-sm sm:text-base text-[#F3EBDD]/95 font-light leading-relaxed mb-9 max-w-xl">Produtos selecionados, novidades internacionais e uma experiência de compra especial para você.</p>
                    <div className="flex flex-wrap items-center gap-4">
                      <button onClick={() => scrollToCatalog('Todos', 'all')} className="px-8 py-4 rounded-full bg-[#FFFFFF] text-[#39291F] text-xs font-semibold tracking-[0.2em] uppercase hover:bg-[#F3EBDD] shadow-md">EXPLORAR PRODUTOS</button>
                      <a href={STORE_CONFIG.whatsappLink} target="_blank" rel="noopener noreferrer" className="px-7 py-4 rounded-full bg-[#39291F]/50 border border-[#E5D5C0]/45 text-[#F3EBDD] text-xs tracking-[0.16em] uppercase hover:bg-[#FFFFFF]/15">Atendimento VIP</a>
                    </div>
                  </div>
                </div>
              </section>

              {/* Diferenciais */}
              <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                  {[
                    { icon: 'sparkles', title: 'Curadoria Internacional', desc: 'Seleção criteriosa de importados' },
                    { icon: 'award', title: 'Origem Garantida', desc: 'Paraguai, Argentina & destinos globais' },
                    { icon: 'whatsapp', title: 'Atendimento Personalizado', desc: 'Consultoria direta via WhatsApp' },
                    { icon: 'shield', title: 'Compra Segura', desc: 'Checkout protegido e envio ágil' },
                  ].map((item, idx) => (
                    <div key={idx} className="bg-[#F3EBDD]/55 border border-[#E5D5C0]/70 rounded-3xl p-4 sm:p-5 flex items-center gap-3.5">
                      <div className="w-10 h-10 rounded-full bg-[#FFFFFF] border border-[#E5D5C0] flex items-center justify-center shrink-0 text-[#70513D]"><Icon name={item.icon} className="w-4 h-4" /></div>
                      <div>
                        <h3 className="text-xs font-semibold text-[#39291F]">{item.title}</h3>
                        <p className="text-[11px] text-[#77716B] mt-0.5">{item.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </section>

              {/* Categorias Circulares */}
              <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                <div className="mb-6">
                  <span className="text-[10px] uppercase tracking-[0.25em] text-[#77716B]">Departamentos</span>
                  <h2 className="font-editorial text-3xl text-[#39291F]">Explore por Categoria</h2>
                </div>
                <div className="flex items-center gap-4 sm:gap-6 overflow-x-auto no-scrollbar pb-2">
                  {CATEGORIES.map((cat) => {
                    const isSelected = selectedCategory === cat.id;
                    return (
                      <button key={cat.id} onClick={() => { setSelectedCategory(cat.id); setEditorialFilter('all'); }} className="flex flex-col items-center gap-2.5 shrink-0 group">
                        <div className={`w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden transition-all border-2 ${isSelected ? 'border-[#39291F] ring-4 ring-[#E5D5C0]/70 scale-105 shadow-md' : 'border-[#E5D5C0] group-hover:border-[#70513D]'}`}>
                          <img src={cat.image} alt={cat.label} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                        </div>
                        <span className={`text-xs tracking-wide ${isSelected ? 'font-semibold text-[#39291F]' : 'text-[#77716B]'}`}>{cat.label}</span>
                      </button>
                    );
                  })}
                </div>
              </section>

              {/* Cards Editoriais */}
              <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-12">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                  <button onClick={() => scrollToCatalog('Todos', 'new')} className="relative overflow-hidden text-left rounded-[2rem] bg-[#F3EBDD] border border-[#E5D5C0] p-7 hover:shadow-lg group flex flex-col justify-between min-h-[220px]">
                    <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=800&q=80" alt="Novidades" className="absolute inset-0 w-full h-full object-cover opacity-35 group-hover:scale-105 transition-transform duration-500" />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#F3EBDD]/95 via-[#F3EBDD]/80 to-[#F3EBDD]/40" />
                    <div className="relative z-10">
                      <span className="text-[10px] uppercase tracking-[0.22em] text-[#70513D] font-semibold">Lançamentos</span>
                      <h3 className="font-editorial text-3xl text-[#39291F] mt-1">Novidades Internacionais</h3>
                      <p className="text-xs text-[#39291F]/80 mt-2 max-w-[240px]">Recém-chegados selecionados das melhores vitrines internacionais.</p>
                    </div>
                    <span className="relative z-10 inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-[#39291F] mt-5">Ver Novidades <Icon name="arrowRight" className="w-3.5 h-3.5" /></span>
                  </button>

                  <button onClick={() => scrollToCatalog('Todos', 'bestseller')} className="relative overflow-hidden text-left rounded-[2rem] bg-[#39291F] text-[#FFFFFF] p-7 hover:shadow-lg group flex flex-col justify-between min-h-[220px]">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80" alt="Mais Vendidos" className="absolute inset-0 w-full h-full object-cover opacity-45 group-hover:scale-105 transition-transform duration-500" />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#39291F]/95 via-[#39291F]/75 to-[#39291F]/35" />
                    <div className="relative z-10">
                      <span className="text-[10px] uppercase tracking-[0.22em] text-[#E5D5C0] font-semibold">Favoritos</span>
                      <h3 className="font-editorial text-3xl text-[#FFFFFF] mt-1">Mais Vendidos</h3>
                      <p className="text-xs text-[#F3EBDD]/85 mt-2 max-w-[240px]">Os itens mais desejados e recomendados pelas nossas clientes.</p>
                    </div>
                    <span className="relative z-10 inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-[#E5D5C0] mt-5">Explorar Seleção <Icon name="arrowRight" className="w-3.5 h-3.5" /></span>
                  </button>

                  <button onClick={() => scrollToCatalog('Ofertas', 'promo')} className="relative overflow-hidden text-left rounded-[2rem] bg-[#E5D5C0] border border-[#E5D5C0] p-7 hover:shadow-lg group flex flex-col justify-between min-h-[220px]">
                    <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?auto=format&fit=crop&w=800&q=80" alt="Ofertas" className="absolute inset-0 w-full h-full object-cover opacity-35 group-hover:scale-105 transition-transform duration-500" />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#E5D5C0]/95 via-[#E5D5C0]/80 to-[#E5D5C0]/40" />
                    <div className="relative z-10">
                      <span className="text-[10px] uppercase tracking-[0.22em] text-[#70513D] font-semibold">Oportunidades</span>
                      <h3 className="font-editorial text-3xl text-[#39291F] mt-1">Ofertas Especiais</h3>
                      <p className="text-xs text-[#39291F]/80 mt-2 max-w-[240px]">Condições exclusivas por tempo limitado em itens selecionados.</p>
                    </div>
                    <span className="relative z-10 inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-[#39291F] mt-5">Conferir Ofertas <Icon name="arrowRight" className="w-3.5 h-3.5" /></span>
                  </button>
                </div>
              </section>

              {/* Vitrine */}
              <section ref={catalogSectionRef} className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 scroll-mt-24">
                <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-8">
                  <div>
                    <span className="text-[10px] uppercase tracking-[0.25em] text-[#77716B]">Vitrine Oficial</span>
                    <h2 className="font-editorial text-3xl sm:text-4xl text-[#39291F]">{selectedCategory === 'Todos' ? 'Curadoria em Destaque' : selectedCategory}</h2>
                  </div>
                  {(selectedCategory !== 'Todos' || editorialFilter !== 'all' || searchQuery) && (
                    <button onClick={() => { setSelectedCategory('Todos'); setEditorialFilter('all'); setSearchQuery(''); }} className="self-start px-4 py-2 rounded-full bg-[#F3EBDD] text-[#39291F] text-xs">Limpar Filtros</button>
                  )}
                </div>

                {filteredProducts.length === 0 ? (
                  <div className="bg-[#F3EBDD]/45 border border-[#E5D5C0] rounded-[2.5rem] p-12 sm:p-16 text-center max-w-3xl mx-auto">
                    <div className="w-16 h-16 rounded-full bg-[#FFFFFF] border border-[#E5D5C0] flex items-center justify-center mx-auto mb-5 text-[#70513D]"><Icon name="sparkles" className="w-7 h-7" /></div>
                    <h3 className="font-editorial text-3xl text-[#39291F] mb-3">{products.length === 0 ? 'Curadoria em Atualização' : 'Nenhum item encontrado com este filtro'}</h3>
                    <p className="text-xs sm:text-sm text-[#77716B] leading-relaxed max-w-lg mx-auto mb-8">
                      Nossa seleção exclusiva de perfumes, cosméticos e acessórios importados está sendo atualizada. Fale conosco pelo WhatsApp para encomendas personalizadas.
                    </p>
                    <a href={STORE_CONFIG.whatsappLink} target="_blank" rel="noopener noreferrer" className="px-7 py-3.5 rounded-full bg-[#39291F] text-[#FFFFFF] text-xs uppercase tracking-widest font-medium hover:bg-[#70513D] inline-flex items-center gap-2">
                      <Icon name="whatsapp" className="w-4 h-4" /> Consultar Disponibilidade no WhatsApp
                    </a>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    {filteredProducts.map((product) => {
                      const hasPromo = product.promoPrice && Number(product.promoPrice) < Number(product.price);
                      const isOutOfStock = Number(product.stock) <= 0;
                      return (
                        <div key={product.id} className="group bg-[#FFFFFF] border border-[#E5D5C0]/80 rounded-[2rem] overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col">
                          <div onClick={() => setSelectedProductModal(product)} className="relative aspect-[4/5] bg-[#F3EBDD]/50 overflow-hidden cursor-pointer">
                            {product.image ? (
                              <img src={product.image} alt={product.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                            ) : (
                              <div className="w-full h-full flex flex-col items-center justify-center text-[#70513D]/50"><Icon name="sparkles" className="w-8 h-8 mb-2" /><span className="text-[10px] uppercase tracking-widest">Cybele Imports</span></div>
                            )}
                            {hasPromo && <span className="absolute top-3.5 left-3.5 px-3 py-1 rounded-full bg-[#39291F] text-[#FFFFFF] text-[10px] uppercase tracking-wider font-medium">Oferta</span>}
                            {isOutOfStock && <div className="absolute inset-0 bg-[#FFFFFF]/75 flex items-center justify-center"><span className="px-4 py-1.5 rounded-full bg-[#39291F] text-[#FFFFFF] text-[10px] uppercase tracking-widest">Esgotado</span></div>}
                          </div>
                          <div className="p-5 flex-1 flex flex-col justify-between">
                            <div>
                              <span className="text-[10px] uppercase tracking-[0.2em] text-[#77716B]">{product.category}</span>
                              <h3 onClick={() => setSelectedProductModal(product)} className="font-editorial text-xl text-[#39291F] mt-1 cursor-pointer hover:text-[#70513D] line-clamp-2">{product.name}</h3>
                              {product.description && <p className="text-xs text-[#77716B] mt-1.5 line-clamp-2">{product.description}</p>}
                            </div>
                            <div className="mt-4 pt-3 border-t border-[#F3EBDD]">
                              <div className="flex items-baseline gap-2 mb-3">
                                {hasPromo ? (
                                  <>
                                    <span className="text-base font-semibold text-[#39291F]">{formatCurrency(product.promoPrice)}</span>
                                    <span className="text-xs line-through text-[#77716B]">{formatCurrency(product.price)}</span>
                                  </>
                                ) : (
                                  <span className="text-base font-semibold text-[#39291F]">{formatCurrency(product.price)}</span>
                                )}
                              </div>
                              <div className="flex items-center gap-2">
                                <button disabled={isOutOfStock} onClick={() => { addToCart(product, 1); setIsCartOpen(false); setCheckoutStep(1); setIsCheckoutOpen(true); }} className="flex-1 py-2.5 px-4 rounded-full bg-[#39291F] text-[#FFFFFF] text-[11px] uppercase tracking-wider font-medium hover:bg-[#70513D] disabled:opacity-40">Comprar</button>
                                <button disabled={isOutOfStock} onClick={() => addToCart(product, 1)} className="p-2.5 rounded-full bg-[#F3EBDD] text-[#39291F] hover:bg-[#E5D5C0] disabled:opacity-40"><Icon name="bag" className="w-4 h-4" /></button>
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </section>

              {/* Institucional */}
              <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
                <div className="bg-[#F3EBDD]/70 border border-[#E5D5C0] rounded-[2.5rem] p-8 sm:p-14 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                  <div className="lg:col-span-7">
                    <span className="text-[10px] uppercase tracking-[0.25em] text-[#70513D]">Sobre a Marca</span>
                    <h2 className="font-editorial text-3xl sm:text-4xl text-[#39291F] mt-2 mb-4">Sofisticação e procedência em cada escolha.</h2>
                    <p className="text-xs sm:text-sm text-[#77716B] leading-relaxed mb-6">
                      A <strong>CYBELE IMPORTS</strong> nasceu com o propósito de aproximar você das melhores tendências internacionais do Paraguai, Argentina e mercados globais. Trabalhamos com curadoria dedicada, atendimento próximo e total transparência do pedido à entrega.
                    </p>
                    <div className="flex flex-wrap items-center gap-4">
