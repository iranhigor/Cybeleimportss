                      <a href={STORE_CONFIG.instagramLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-[#39291F] text-[#FFFFFF] text-xs uppercase tracking-widest hover:bg-[#70513D]"><Icon name="instagram" className="w-4 h-4" /> Seguir {STORE_CONFIG.instagramHandle}</a>
                      <a href={STORE_CONFIG.whatsappLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-[#FFFFFF] border border-[#E5D5C0] text-[#39291F] text-xs uppercase tracking-widest"><Icon name="phone" className="w-4 h-4 text-[#70513D]" /> {STORE_CONFIG.whatsappNumber}</a>
                    </div>
                  </div>
                  <div className="lg:col-span-5 relative overflow-hidden bg-[#39291F] text-[#F3EBDD] rounded-[2rem] p-8 min-h-[240px] flex flex-col justify-end">
                    <img src="https://images.unsplash.com/photo-1595425970377-c9703cf48b6d?auto=format&fit=crop&w=900&q=80" alt="Curadoria Cybele Imports" className="absolute inset-0 w-full h-full object-cover opacity-40" />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#39291F]/95 via-[#39291F]/70 to-transparent" />
                    <div className="relative z-10">
                      <p className="font-editorial text-2xl text-[#FFFFFF] mb-2">Atendimento Personalizado</p>
                      <p className="text-xs text-[#E5D5C0]/90 leading-relaxed mb-5">Procura uma fragrância específica, cosmético importado ou acessório exclusivo? Fale diretamente com nossa equipe.</p>
                      <div className="space-y-2 text-xs text-[#F3EBDD]">
                        <div className="flex items-center gap-2.5"><Icon name="phone" className="w-4 h-4 text-[#E5D5C0]" /><span>{STORE_CONFIG.whatsappNumber}</span></div>
                        <div className="flex items-center gap-2.5"><Icon name="instagram" className="w-4 h-4 text-[#E5D5C0]" /><span>{STORE_CONFIG.instagramHandle}</span></div>
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            </main>
          )}

          {/* Rodapé */}
          <footer className="bg-[#39291F] text-[#F3EBDD] mt-12">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14 grid grid-cols-1 md:grid-cols-4 gap-10">
              <div className="md:col-span-2">
                <span className="font-editorial text-2xl tracking-[0.22em] text-[#FFFFFF]">CYBELE IMPORTS</span>
                <p className="text-xs text-[#E5D5C0]/80 mt-3 max-w-md leading-relaxed">Produtos selecionados, novidades internacionais e uma experiência de compra especial para você.</p>
              </div>
              <div>
                <h4 className="text-[11px] uppercase tracking-[0.2em] text-[#E5D5C0] font-semibold mb-4">Navegação</h4>
                <ul className="space-y-2.5 text-xs text-[#F3EBDD]/80">
                  <li><button onClick={() => scrollToCatalog('Todos', 'all')} className="hover:text-[#FFFFFF]">Catálogo Completo</button></li>
                  <li><button onClick={() => scrollToCatalog('Perfumes', 'all')} className="hover:text-[#FFFFFF]">Perfumes Importados</button></li>
                  <li><button onClick={() => scrollToCatalog('Cosméticos', 'all')} className="hover:text-[#FFFFFF]">Cosméticos &amp; Beleza</button></li>
                  <li><button onClick={() => scrollToCatalog('Ofertas', 'promo')} className="hover:text-[#FFFFFF]">Ofertas Especiais</button></li>
                </ul>
              </div>
              <div>
                <h4 className="text-[11px] uppercase tracking-[0.2em] text-[#E5D5C0] font-semibold mb-4">Contato &amp; Redes</h4>
                <ul className="space-y-3 text-xs text-[#F3EBDD]/85">
                  <li><a href={STORE_CONFIG.whatsappLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 hover:text-[#FFFFFF]"><Icon name="phone" className="w-3.5 h-3.5 text-[#E5D5C0]" /> WhatsApp: {STORE_CONFIG.whatsappNumber}</a></li>
                  <li><a href={STORE_CONFIG.instagramLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 hover:text-[#FFFFFF]"><Icon name="instagram" className="w-3.5 h-3.5 text-[#E5D5C0]" /> Instagram: {STORE_CONFIG.instagramHandle}</a></li>
                  <li className="flex items-center gap-2 text-[#E5D5C0]/75"><Icon name="lock" className="w-3.5 h-3.5" /> Ambiente protegido • LGPD</li>
                </ul>
              </div>
            </div>
            <div className="border-t border-[#E5D5C0]/15 py-5 px-4 text-center text-[11px] text-[#E5D5C0]/60">
              <span onClick={() => { footerClickCountRef.current += 1; if (footerClickCountRef.current >= 3) { footerClickCountRef.current = 0; if (isAdminAuthenticated) setActiveView('admin'); else { setAuthModalMode('admin'); setAuthError(''); setIsAccountModalOpen(true); } } }} className="cursor-default select-none">
                © {new Date().getFullYear()} CYBELE IMPORTS. Todos os direitos reservados.
              </span>
            </div>
          </footer>

          {/* Botão Flutuante WhatsApp */}
          <a href={STORE_CONFIG.whatsappLink} target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 z-40 flex items-center gap-2.5 px-5 py-3.5 rounded-full bg-[#39291F] text-[#FFFFFF] border border-[#E5D5C0]/40 shadow-2xl hover:bg-[#70513D]">
            <Icon name="whatsapp" className="w-5 h-5 text-[#E5D5C0]" />
            <span className="hidden sm:inline text-xs font-medium tracking-wider">WhatsApp</span>
          </a>

          {/* Modal Detalhes do Produto */}
          {selectedProductModal && (
            <div className="fixed inset-0 z-50 bg-[#39291F]/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#FFFFFF] rounded-[2.25rem] max-w-2xl w-full overflow-hidden shadow-2xl border border-[#E5D5C0] grid grid-cols-1 md:grid-cols-2">
                <div className="aspect-square bg-[#F3EBDD]">
                  {selectedProductModal.image ? <img src={selectedProductModal.image} alt={selectedProductModal.name} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-[#70513D]"><Icon name="sparkles" className="w-10 h-10" /></div>}
                </div>
                <div className="p-6 sm:p-8 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] uppercase tracking-[0.2em] text-[#77716B]">{selectedProductModal.category}</span>
                      <button onClick={() => setSelectedProductModal(null)} className="p-1.5 rounded-full bg-[#F3EBDD] text-[#39291F]"><Icon name="x" className="w-4 h-4" /></button>
                    </div>
                    <h3 className="font-editorial text-2xl sm:text-3xl text-[#39291F] mt-2">{selectedProductModal.name}</h3>
                    <p className="text-xs text-[#77716B] mt-3 leading-relaxed">{selectedProductModal.description || 'Produto importado selecionado.'}</p>
                    <p className="text-[11px] text-[#70513D] mt-3">Disponibilidade: <strong>{selectedProductModal.stock} unidade(s)</strong></p>
                  </div>
                  <div className="mt-6 pt-4 border-t border-[#F3EBDD]">
                    <div className="mb-4">
                      {selectedProductModal.promoPrice && selectedProductModal.promoPrice < selectedProductModal.price ? (
                        <div className="flex items-baseline gap-2">
                          <span className="text-xl font-semibold text-[#39291F]">{formatCurrency(selectedProductModal.promoPrice)}</span>
                          <span className="text-xs line-through text-[#77716B]">{formatCurrency(selectedProductModal.price)}</span>
                        </div>
                      ) : (
                        <span className="text-xl font-semibold text-[#39291F]">{formatCurrency(selectedProductModal.price)}</span>
                      )}
                    </div>
                    <button disabled={selectedProductModal.stock <= 0} onClick={() => { addToCart(selectedProductModal, 1); setSelectedProductModal(null); }} className="w-full py-3.5 rounded-full bg-[#39291F] text-[#FFFFFF] text-xs uppercase tracking-widest font-medium hover:bg-[#70513D] disabled:opacity-40">
                      {selectedProductModal.stock > 0 ? 'Adicionar à Sacola' : 'Produto Esgotado'}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Drawer Sacola */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-[#39291F]/55 flex justify-end">
              <div className="bg-[#FFFFFF] w-full max-w-md h-full flex flex-col justify-between shadow-2xl rounded-l-[2.25rem] overflow-hidden">
                <div className="p-6 border-b border-[#F3EBDD] flex items-center justify-between">
                  <div>
                    <h3 className="font-editorial text-2xl text-[#39291F]">Sua Sacola</h3>
                    <p className="text-[11px] text-[#77716B]">{cartItemsCount} item(ns) selecionado(s)</p>
                  </div>
                  <button onClick={() => setIsCartOpen(false)} className="p-2 rounded-full bg-[#F3EBDD] text-[#39291F]"><Icon name="x" className="w-4 h-4" /></button>
                </div>

                <div className="flex-1 overflow-y-auto p-6 space-y-4">
                  {cart.length === 0 ? (
                    <div className="text-center py-16">
                      <Icon name="bag" className="w-10 h-10 text-[#70513D]/60 mx-auto mb-3" />
                      <p className="font-editorial text-2xl text-[#39291F]">Sua sacola está vazia</p>
                    </div>
                  ) : (
                    <>
                      {cart.map((item) => (
                        <div key={item.id} className="flex items-center gap-3.5 p-3.5 rounded-3xl bg-[#F3EBDD]/45 border border-[#E5D5C0]/70">
                          <div className="w-16 h-16 rounded-2xl bg-[#FFFFFF] overflow-hidden shrink-0 flex items-center justify-center">
                            {item.image ? <img src={item.image} alt={item.name} className="w-full h-full object-cover" /> : <Icon name="sparkles" className="w-5 h-5 text-[#70513D]" />}
                          </div>
                          <div className="flex-1 min-w-0">
                            <h4 className="text-xs font-medium text-[#39291F] truncate">{item.name}</h4>
                            <p className="text-xs font-semibold text-[#70513D] mt-0.5">{formatCurrency(item.price)}</p>
                            <div className="flex items-center gap-2 mt-2">
                              <button onClick={() => updateCartQuantity(item.id, -1)} className="w-6 h-6 rounded-full bg-[#FFFFFF] border border-[#E5D5C0] flex items-center justify-center"><Icon name="minus" className="w-3 h-3" /></button>
                              <span className="text-xs font-medium w-5 text-center">{item.quantity}</span>
                              <button onClick={() => updateCartQuantity(item.id, 1)} className="w-6 h-6 rounded-full bg-[#FFFFFF] border border-[#E5D5C0] flex items-center justify-center"><Icon name="plus" className="w-3 h-3" /></button>
                            </div>
                          </div>
                          <button onClick={() => removeFromCart(item.id)} className="p-2 text-[#77716B] hover:text-[#39291F]"><Icon name="trash" className="w-4 h-4" /></button>
                        </div>
                      ))}

                      <div className="pt-2">
                        <label className="block text-[11px] uppercase tracking-wider text-[#77716B] mb-1.5">Cupom Promocional</label>
                        <div className="flex gap-2">
                          <input type="text" value={couponInput} onChange={(e) => setCouponInput(e.target.value)} placeholder="Digite seu cupom" className="flex-1 px-4 py-2.5 rounded-full bg-[#F3EBDD]/60 border border-[#E5D5C0] text-xs uppercase" />
                          <button onClick={handleApplyCoupon} className="px-5 py-2.5 rounded-full bg-[#70513D] text-[#FFFFFF] text-xs uppercase tracking-wider">Aplicar</button>
                        </div>
                      </div>

                      <div className="pt-2">
                        <label className="block text-[11px] uppercase tracking-wider text-[#77716B] mb-1.5">Recebimento</label>
                        <div className="grid grid-cols-2 gap-2">
                          <button type="button" onClick={() => setDeliveryMethod('shipping')} className={`py-2.5 px-3 rounded-2xl text-xs border ${deliveryMethod === 'shipping' ? 'bg-[#39291F] text-[#FFFFFF] border-[#39291F]' : 'bg-[#F3EBDD]/50 text-[#39291F] border-[#E5D5C0]'}`}>Entrega no Endereço</button>
                          <button type="button" onClick={() => setDeliveryMethod('pickup')} className={`py-2.5 px-3 rounded-2xl text-xs border ${deliveryMethod === 'pickup' ? 'bg-[#39291F] text-[#FFFFFF] border-[#39291F]' : 'bg-[#F3EBDD]/50 text-[#39291F] border-[#E5D5C0]'}`}>Retirada Combinada</button>
                        </div>
                      </div>
                    </>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-6 bg-[#F3EBDD]/60 border-t border-[#E5D5C0] space-y-2.5 text-xs">
                    <div className="flex justify-between text-[#77716B]"><span>Subtotal</span><span>{formatCurrency(subtotal)}</span></div>
                    {discountAmount > 0 && <div className="flex justify-between text-[#70513D] font-medium"><span>Desconto ({appliedCoupon?.code})</span><span>-{formatCurrency(discountAmount)}</span></div>}
                    <div className="flex justify-between text-[#77716B]"><span>Frete</span><span>{shippingCost === 0 ? 'Grátis' : formatCurrency(shippingCost)}</span></div>
                    <div className="flex justify-between text-base font-semibold text-[#39291F] pt-2 border-t border-[#E5D5C0]"><span>Total</span><span>{formatCurrency(grandTotal)}</span></div>
                    <button onClick={() => { setIsCartOpen(false); setCheckoutStep(1); setIsCheckoutOpen(true); }} className="w-full mt-3 py-3.5 rounded-full bg-[#39291F] text-[#FFFFFF] text-xs uppercase tracking-widest font-medium hover:bg-[#70513D]">Finalizar Compra</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Modal Checkout Simplificado & PIX */}
          {isCheckoutOpen && (
            <div className="fixed inset-0 z-50 bg-[#39291F]/65 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-[#FFFFFF] rounded-[2.25rem] max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-[#E5D5C0] my-8">
                <div className="flex items-center justify-between pb-4 border-b border-[#F3EBDD]">
                  <div>
                    <span className="text-[10px] uppercase tracking-[0.2em] text-[#77716B]">Checkout Seguro • Cybele Imports</span>
                    <h3 className="font-editorial text-2xl sm:text-3xl text-[#39291F]">{checkoutStep === 1 ? 'Dados para Entrega' : checkoutStep === 2 ? 'Resumo & Pagamento' : 'Pedido Registrado'}</h3>
                  </div>
                  <button onClick={() => setIsCheckoutOpen(false)} className="p-2 rounded-full bg-[#F3EBDD] text-[#39291F]"><Icon name="x" className="w-4 h-4" /></button>
                </div>

                {checkoutStep === 1 && (
                  <form onSubmit={(e) => { e.preventDefault(); setCheckoutStep(2); }} className="mt-5 space-y-4 text-xs">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                      <div><label className="block font-medium text-[#39291F] mb-1">Nome Completo *</label><input type="text" required value={checkoutForm.fullName} onChange={(e) => setCheckoutForm((p) => ({ ...p, fullName: e.target.value }))} className="w-full px-4 py-3 rounded-2xl bg-[#F3EBDD]/40 border border-[#E5D5C0]" /></div>
                      <div><label className="block font-medium text-[#39291F] mb-1">WhatsApp / Telefone *</label><input type="tel" required value={checkoutForm.phone} onChange={(e) => setCheckoutForm((p) => ({ ...p, phone: e.target.value }))} placeholder="(15) 99999-9999" className="w-full px-4 py-3 rounded-2xl bg-[#F3EBDD]/40 border border-[#E5D5C0]" /></div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                      <div><label className="block font-medium text-[#39291F] mb-1">E-mail *</label><input type="email" required value={checkoutForm.email} onChange={(e) => setCheckoutForm((p) => ({ ...p, email: e.target.value }))} className="w-full px-4 py-3 rounded-2xl bg-[#F3EBDD]/40 border border-[#E5D5C0]" /></div>
                      <div><label className="block font-medium text-[#39291F] mb-1">CPF</label><input type="text" value={checkoutForm.cpf} onChange={(e) => setCheckoutForm((p) => ({ ...p, cpf: e.target.value }))} placeholder="000.000.000-00" className="w-full px-4 py-3 rounded-2xl bg-[#F3EBDD]/40 border border-[#E5D5C0]" /></div>
                    </div>
                    {deliveryMethod === 'shipping' && (
                      <>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
                          <div><label className="block font-medium text-[#39291F] mb-1">CEP *</label><input type="text" required value={checkoutForm.cep} onChange={(e) => setCheckoutForm((p) => ({ ...p, cep: e.target.value }))} placeholder="00000-000" className="w-full px-4 py-3 rounded-2xl bg-[#F3EBDD]/40 border border-[#E5D5C0]" /></div>
                          <div className="sm:col-span-2"><label className="block font-medium text-[#39291F] mb-1">Endereço Completo *</label><input type="text" required value={checkoutForm.address} onChange={(e) => setCheckoutForm((p) => ({ ...p, address: e.target.value }))} className="w-full px-4 py-3 rounded-2xl bg-[#F3EBDD]/40 border border-[#E5D5C0]" /></div>
                        </div>
                        <div className="grid grid-cols-2 gap-3.5">
                          <div><label className="block font-medium text-[#39291F] mb-1">Número *</label><input type="text" required value={checkoutForm.number} onChange={(e) => setCheckoutForm((p) => ({ ...p, number: e.target.value }))} className="w-full px-4 py-3 rounded-2xl bg-[#F3EBDD]/40 border border-[#E5D5C0]" /></div>
                          <div><label className="block font-medium text-[#39291F] mb-1">Complemento</label><input type="text" value={checkoutForm.complement} onChange={(e) => setCheckoutForm((p) => ({ ...p, complement: e.target.value }))} className="w-full px-4 py-3 rounded-2xl bg-[#F3EBDD]/40 border border-[#E5D5C0]" /></div>
                        </div>
                      </>
                    )}
                    <label className="flex items-start gap-2.5 pt-2 text-[11px] text-[#77716B] cursor-pointer">
                      <input type="checkbox" required checked={checkoutForm.lgpdAccepted} onChange={(e) => setCheckoutForm((p) => ({ ...p, lgpdAccepted: e.target.checked }))} className="mt-0.5" />
                      <span>Concordo com o tratamento dos meus dados exclusivamente para entrega e processamento deste pedido (LGPD).</span>
                    </label>
                    <div className="flex justify-end pt-2"><button type="submit" className="px-8 py-3.5 rounded-full bg-[#39291F] text-[#FFFFFF] uppercase tracking-widest font-medium hover:bg-[#70513D]">Continuar para Pagamento</button></div>
                  </form>
                )}

                {checkoutStep === 2 && (
                  <form onSubmit={handleCreateOrder} className="mt-5 space-y-5 text-xs">
                    <div className="bg-[#F3EBDD]/60 border border-[#E5D5C0] rounded-3xl p-5 space-y-2">
                      <p className="font-semibold text-[#39291F] uppercase tracking-wider text-[11px]">Resumo do Pedido</p>
                      {cart.map((item) => <div key={item.id} className="flex justify-between text-[#77716B]"><span>{item.quantity}x {item.name}</span><span>{formatCurrency(item.price * item.quantity)}</span></div>)}
                      <div className="flex justify-between text-base font-semibold text-[#39291F] pt-2 border-t border-[#E5D5C0]"><span>Total a Pagar</span><span>{formatCurrency(grandTotal)}</span></div>
                    </div>

                    <div>
                      <p className="font-medium text-[#39291F] mb-2.5">Escolha a Forma de Pagamento</p>
                      <div className="grid grid-cols-2 gap-3">
                        <button type="button" onClick={() => setCheckoutForm((p) => ({ ...p, paymentMethod: 'pix' }))} className={`p-4 rounded-3xl border text-left flex items-center gap-3 ${checkoutForm.paymentMethod === 'pix' ? 'bg-[#39291F] text-[#FFFFFF] border-[#39291F]' : 'bg-[#FFFFFF] text-[#39291F] border-[#E5D5C0]'}`}>
                          <Icon name="qr" className="w-5 h-5 shrink-0" />
                          <div><p className="font-semibold">PIX Direto</p><p className="text-[10px] opacity-80">QR Code e Copia e Cola</p></div>
                        </button>
                        <button type="button" onClick={() => setCheckoutForm((p) => ({ ...p, paymentMethod: 'credit_card' }))} className={`p-4 rounded-3xl border text-left flex items-center gap-3 ${checkoutForm.paymentMethod === 'credit_card' ? 'bg-[#39291F] text-[#FFFFFF] border-[#39291F]' : 'bg-[#FFFFFF] text-[#39291F] border-[#E5D5C0]'}`}>
                          <Icon name="card" className="w-5 h-5 shrink-0" />
                          <div><p className="font-semibold">Cartão de Crédito</p><p className="text-[10px] opacity-80">Link seguro de pagamento</p></div>
                        </button>
                      </div>
                    </div>

                    <div className="flex items-center justify-between pt-2">
                      <button type="button" onClick={() => setCheckoutStep(1)} className="px-5 py-3 rounded-full bg-[#F3EBDD] text-[#39291F] uppercase tracking-wider">Voltar</button>
                      <button type="submit" className="px-8 py-3.5 rounded-full bg-[#39291F] text-[#FFFFFF] uppercase tracking-widest font-medium hover:bg-[#70513D]">{checkoutForm.paymentMethod === 'pix' ? 'Gerar QR Code PIX' : 'Finalizar Pedido'}</button>
                    </div>
                  </form>
                )}

                {checkoutStep === 3 && completedOrder && (
                  <div className="mt-6 text-center space-y-4">
                    <div className="w-14 h-14 rounded-full bg-[#F3EBDD] text-[#39291F] flex items-center justify-center mx-auto"><Icon name="checkCircle" className="w-7 h-7 text-[#70513D]" /></div>
                    <h4 className="font-editorial text-3xl text-[#39291F]">Pedido {completedOrder.orderNumber} Criado!</h4>
                    {completedOrder.paymentMethod === 'pix' && completedOrder.pixCopyPaste && (
                      <div className="bg-[#F3EBDD]/65 border border-[#E5D5C0] rounded-3xl p-5 max-w-md mx-auto space-y-3">
                        <p className="text-xs font-medium text-[#39291F]">Escaneie o QR Code ou copie o código PIX abaixo no aplicativo do seu banco:</p>
                        <div className="w-44 h-44 mx-auto bg-[#FFFFFF] p-2.5 rounded-2xl border border-[#E5D5C0] flex items-center justify-center">
                          <img src={`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(completedOrder.pixCopyPaste)}`} alt="QR Code PIX" className="w-full h-full object-contain" />
                        </div>
                        <p className="text-sm font-semibold text-[#39291F]">Valor: {formatCurrency(completedOrder.total)}</p>
                        <div className="flex items-center gap-2 bg-[#FFFFFF] border border-[#E5D5C0] rounded-2xl p-2">
                          <input type="text" readOnly value={completedOrder.pixCopyPaste} className="flex-1 bg-transparent text-[11px] text-[#77716B] px-2 focus:outline-none truncate" />
                          <button type="button" onClick={() => { navigator.clipboard?.writeText(completedOrder.pixCopyPaste); showToast('Código PIX copiado!'); }} className="px-4 py-2 rounded-xl bg-[#39291F] text-[#FFFFFF] text-[11px] font-medium uppercase shrink-0">Copiar PIX</button>
                        </div>
                      </div>
                    )}
                    <div className="flex flex-wrap justify-center gap-3 pt-2">
                      <a href={`${STORE_CONFIG.whatsappLink}&text=${encodeURIComponent(`Olá! Realizei o pedido ${completedOrder.orderNumber} (${formatCurrency(completedOrder.total)}) na Cybele Imports e segue o comprovante.`)}`} target="_blank" rel="noopener noreferrer" className="px-6 py-3 rounded-full bg-[#39291F] text-[#FFFFFF] text-xs uppercase tracking-wider inline-flex items-center gap-2"><Icon name="whatsapp" className="w-4 h-4" /> Enviar Comprovante no WhatsApp</a>
                      <button onClick={() => setIsCheckoutOpen(false)} className="px-6 py-3 rounded-full bg-[#F3EBDD] text-[#39291F] text-xs uppercase tracking-wider">Concluir</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Modal Autenticação */}
          {isAccountModalOpen && (
            <div className="fixed inset-0 z-50 bg-[#39291F]/65 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#FFFFFF] rounded-[2.25rem] max-w-md w-full p-6 sm:p-8 shadow-2xl border border-[#E5D5C0] relative">
                <button onClick={() => setIsAccountModalOpen(false)} className="absolute top-6 right-6 p-2 rounded-full bg-[#F3EBDD] text-[#39291F]"><Icon name="x" className="w-4 h-4" /></button>

                {authModalMode === 'admin' ? (
                  <>
                    <div className="mb-5 p-3 rounded-2xl bg-[#39291F] text-[#F3EBDD] flex items-center justify-between text-[11px]">
                      <span className="uppercase tracking-wider font-medium text-[#E5D5C0]">Perfil: Proprietária da Loja</span>
                      <span className="text-[10px] text-[#F3EBDD]/75">Acesso Restrito</span>
                    </div>
                    <h3 className="font-editorial text-3xl text-[#39291F] mb-2">Gestão Cybele Imports</h3>
                    {authError && <div className="mb-4 p-3 rounded-2xl bg-[#39291F] text-[#FFFFFF] text-xs flex items-center gap-2"><Icon name="alert" className="w-4 h-4 text-[#E5D5C0] shrink-0" /><span>{authError}</span></div>}
                    <form onSubmit={handleAdminLogin} className="space-y-4 text-xs">
                      <div><label className="block font-medium text-[#39291F] mb-1">E-mail Administrativo</label><input type="email" required value={authForm.email} onChange={(e) => setAuthForm((p) => ({ ...p, email: e.target.value }))} placeholder="Digite o e-mail da proprietária" className="w-full px-4 py-3 rounded-2xl bg-[#F3EBDD]/50 border border-[#E5D5C0]" /></div>
                      <div>
                        <label className="block font-medium text-[#39291F] mb-1">Senha</label>
                        <div className="relative">
                          <input type={showPassword ? 'text' : 'password'} required value={authForm.password} onChange={(e) => setAuthForm((p) => ({ ...p, password: e.target.value }))} placeholder="••••••••••••" className="w-full px-4 py-3 rounded-2xl bg-[#F3EBDD]/50 border border-[#E5D5C0] pr-10" />
                          <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3.5 top-3 text-[#77716B]"><Icon name={showPassword ? 'eyeOff' : 'eye'} className="w-4 h-4" /></button>
                        </div>
                      </div>
                      <button type="submit" className="w-full py-3.5 rounded-full bg-[#39291F] text-[#FFFFFF] uppercase tracking-widest font-medium hover:bg-[#70513D]">Entrar no Painel</button>
                    </form>
                    <div className="mt-5 pt-4 border-t border-[#F3EBDD] text-center">
                      <button type="button" onClick={() => { setAuthModalMode('login'); setAuthError(''); }} className="text-xs text-[#70513D] hover:underline">Voltar para o Acesso de Cliente</button>
                    </div>
                  </>
                ) : (
                  <>
                    <div className="mb-4 p-2.5 rounded-2xl bg-[#F3EBDD]/80 border border-[#70513D]/15 flex items-center justify-between text-[11px]">
                      <span className="uppercase tracking-wider font-medium text-[#39291F]">Perfil: Cliente</span>
                      <span className="text-[10px] text-[#77716B]">Compras e Pedidos</span>
                    </div>
                    <h3 className="font-editorial text-3xl text-[#39291F] mb-1.5">{authModalMode === 'register' ? 'Criar sua Conta' : 'Bem-vindo(a)'}</h3>
                    <p className="text-xs text-[#77716B] mb-5">Entre com seu e-mail e senha para acompanhar seus pedidos.</p>
                    {authError && <div className="mb-4 p-3 rounded-2xl bg-[#39291F] text-[#FFFFFF] text-xs flex items-center gap-2"><Icon name="alert" className="w-4 h-4 text-[#E5D5C0] shrink-0" /><span>{authError}</span></div>}
                    <form onSubmit={handleCustomerEmailAuth} className="space-y-3.5 text-xs">
                      {authModalMode === 'register' && (
                        <div><label className="block font-medium text-[#39291F] mb-1">Nome Completo</label><input type="text" required value={authForm.name} onChange={(e) => setAuthForm((p) => ({ ...p, name: e.target.value }))} placeholder="Seu nome" className="w-full px-4 py-3 rounded-2xl bg-[#F3EBDD]/50 border border-[#E5D5C0]" /></div>
                      )}
                      <div><label className="block font-medium text-[#39291F] mb-1">E-mail</label><input type="email" required value={authForm.email} onChange={(e) => setAuthForm((p) => ({ ...p, email: e.target.value }))} placeholder="voce@exemplo.com" className="w-full px-4 py-3 rounded-2xl bg-[#F3EBDD]/50 border border-[#E5D5C0]" /></div>
                      <div>
                        <label className="block font-medium text-[#39291F] mb-1">Senha</label>
                        <div className="relative">
                          <input type={showPassword ? 'text' : 'password'} required value={authForm.password} onChange={(e) => setAuthForm((p) => ({ ...p, password: e.target.value }))} placeholder="Sua senha" className="w-full px-4 py-3 rounded-2xl bg-[#F3EBDD]/50 border border-[#E5D5C0] pr-10" />
                          <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3.5 top-3 text-[#77716B]"><Icon name={showPassword ? 'eyeOff' : 'eye'} className="w-4 h-4" /></button>
                        </div>
                      </div>
                      {authModalMode === 'register' && (
                        <div><label className="block font-medium text-[#39291F] mb-1">Confirmar Senha</label><input type="password" required value={authForm.confirmPassword} onChange={(e) => setAuthForm((p) => ({ ...p, confirmPassword: e.target.value }))} placeholder="Repita sua senha" className="w-full px-4 py-3 rounded-2xl bg-[#F3EBDD]/50 border border-[#E5D5C0]" /></div>
                      )}
                      <button type="submit" className="w-full py-3.5 rounded-full bg-[#39291F] text-[#FFFFFF] uppercase tracking-widest font-medium hover:bg-[#70513D]">{authModalMode === 'register' ? 'Criar Conta Segura' : 'Entrar'}</button>
                    </form>
                    <div className="mt-4 flex flex-col items-center gap-2 text-xs">
                      <button type="button" onClick={() => { setAuthModalMode(authModalMode === 'register' ? 'login' : 'register'); setAuthError(''); }} className="text-[#70513D] font-medium hover:underline">
                        {authModalMode === 'register' ? 'Já possui conta? Entrar' : 'Não tem conta? Cadastre-se aqui'}
                      </button>
                      <button type="button" onClick={() => { setAuthModalMode('admin'); setAuthError(''); }} className="text-[11px] text-[#77716B] hover:text-[#39291F] mt-1">Acesso exclusivo da Proprietária</button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
